# SonarQube Cloud settings for its automatic analysis (the one that runs without a CI step).
# Automatic analysis reads THIS file from the default branch; it ignores sonar-project.properties.
#
# The only Python in this repository is a small helper that writes a test fixture
# (internal/server/wingetindex/testdata/make_fixture.py) and some one-line python3 calls in scripts/.
# They use the standard library only and run on the CI runners' Python 3.12 (Ubuntu 24.04).
# Naming the version stops the analyzer from guessing "3.10 through 3.14".
sonar.python.version=3.12

# Left out of the analysis: test fixtures (data and generators for data, not product code) and binary
# files. A binary file read as text is what the "problems with file encoding" warning is about.
#
# Binary files are not source code.
sonar.exclusions=**/testdata/**,**/*.syso,**/*.msix,**/*.gz,**/*.png
