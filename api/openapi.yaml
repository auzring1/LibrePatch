openapi: 3.0.3
info:
  title: LibrePatch Management API
  version: 0.1.0
  description: |
    REST API used by the LibrePatch web console. Authentication is a server-side
    session cookie (`__Host-lp_session`) obtained via password + mandatory MFA.
    Every state-changing request must carry a same-origin `Origin` header and,
    once a session exists, the `X-CSRF-Token` header returned by the auth endpoints.
    Agent traffic does NOT use this API (see docs/PROTOCOL.md).
servers:
  - url: /api/v1
tags:
  - name: setup
  - name: auth
  - name: devices
  - name: enrollment
  - name: audit
  - name: inventory
  - name: groups
  - name: reports
  - name: catalog
  - name: deployments
  - name: updates
  - name: releases
  - name: identity
  - name: policies
  - name: branding
  - name: settings
  - name: security
paths:
  /setup/status:
    get:
      tags: [setup]
      summary: Whether first-run setup is still pending
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: { type: boolean }
  /setup/begin:
    post:
      tags: [setup]
      summary: Validate the setup token and get a TOTP secret for the first admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, email]
              properties:
                setup_token: { type: string, maxLength: 128 }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "200":
          description: TOTP enrollment data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /setup/complete:
    post:
      tags: [setup]
      summary: Create the organization, first admin (with MFA) and the internal CA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_token, org_name, display_name, email, password, root_passphrase, totp_code]
              properties:
                setup_token: { type: string, maxLength: 128 }
                org_name: { type: string, minLength: 1, maxLength: 120, description: "Also becomes the branding organization name" }
                display_name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 256 }
                root_passphrase: { type: string, minLength: 16, maxLength: 1024 }
                totp_code: { type: string, pattern: "^[0-9]{6}$" }
                logo_base64: { type: string, description: "Optional logo, a PNG or JPEG of at most 512 KiB, base64-encoded; stored re-encoded as the light-background logo" }
      responses:
        "200":
          description: Setup complete; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/sso/info:
    get:
      tags: [auth]
      summary: Whether the sign-in page offers single sign-on, and the address to register at the provider
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, label, redirect_uri]
                properties:
                  enabled: { type: boolean }
                  label: { type: string, description: Text for the button ("Sign in with …") }
                  redirect_uri: { type: string, description: The redirect (reply) address to register for this server at the provider }
  /auth/sso/start:
    get:
      tags: [auth]
      summary: Start a sign-in with the organization's OpenID Connect provider (redirects the browser to it)
      description: Authorization code flow with PKCE and a one-time state and nonce stored on the server for ten minutes. Rate limited like password sign-in.
      security: []
      responses:
        "302": { description: Redirect to the provider }
        "200": { description: A page that sends the browser back to the sign-in page with an error code, when single sign-on is not available }
  /auth/sso/callback:
    get:
      tags: [auth]
      summary: Where the provider sends the person back (not for direct use)
      description: |
        Exchanges the code, verifies the ID token (issuer, audience, signature from the provider's published keys, expiry, nonce), finds or creates the account, brings its provider-managed roles in line with the provider, and starts a session. The answer is a small page that sends the browser on to the console (the session cookie is SameSite=Strict, so a plain redirect after a cross-site navigation would not carry it). Without the provider's proof of multi-factor, or with that setting off, the session is "MFA pending" and the sign-in page asks for the second factor kept here.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "200": { description: A page that continues to the console or to the sign-in page with an error code }
  /auth/sso/continue:
    get:
      tags: [auth]
      summary: The second-factor step for a session that arrived through single sign-on
      security: []
      responses:
        "200":
          description: The same answer as a password sign-in gives (which second-factor methods, or the enrollment of a first one)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      summary: Verify email and password; starts an MFA-pending session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Password accepted; MFA required
          content:
            application/json:
              schema:
                type: object
                required: [mfa, csrf_token]
                properties:
                  mfa: { type: string, enum: [verify, enroll, change_password] }
                  csrf_token: { type: string }
                  methods: { type: array, items: { type: string, enum: [totp, webauthn] }, description: Second factors the account can use (mfa=verify) }
                  totp_secret: { type: string, description: Present when mfa=enroll }
                  otpauth_uri: { type: string, description: Present when mfa=enroll }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/mfa:
    post:
      tags: [auth]
      summary: Complete sign-in with a TOTP or recovery code
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Enroll a new authenticator (after an MFA reset) and complete sign-in
      requestBody: { $ref: "#/components/requestBodies/Code" }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the session
      responses:
        "204": { description: Signed out }
  /auth/session:
    get:
      tags: [auth]
      summary: Current user, organization, permissions and CSRF token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /devices:
    get:
      tags: [devices]
      summary: List devices (requires devices:read)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, revoked, retired] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Device" } }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/{id}:
    get:
      tags: [devices]
      summary: Device detail including hardware inventory (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [devices]
      summary: Delete a revoked device and its inventory, jobs and certificates (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /devices/delete:
    post:
      tags: [devices]
      summary: Delete several revoked devices at once; others are skipped (requires devices:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, skipped]
                properties:
                  deleted: { type: integer }
                  skipped: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /devices/{id}/approve:
    post:
      tags: [devices]
      summary: Approve a pending device (requires devices:write).
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Approved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /devices/{id}/revoke:
    post:
      tags: [devices]
      summary: Revoke a device; its live connection is cut immediately (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /security/master-key:
    get:
      tags: [security]
      summary: Show the master key the stack generated for itself, until it has been saved (requires settings:write; audited)
      description: >
        Only while the key is unacknowledged (a stack that generated its own key shows it to the first administrator once).
        Afterwards 404: the key is never shown again by the API. Only a signed-in console session may call it: a request
        authenticated with an API token answers 403, whatever the token's scopes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [key, key_id, generated_at]
                properties:
                  key: { type: string, description: "64 hexadecimal digits in groups of eight" }
                  key_id: { type: string, description: Short fingerprint of the key }
                  generated_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Error" }
  /security/master-key/acknowledge:
    post:
      tags: [security]
      summary: Confirm that the master key has been saved (requires settings:write and a console session, not an API token; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: string, description: The last six characters of the key }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agent-downloads:
    get:
      tags: [enrollment]
      summary: The agent installers (MSI and exe) this server offers for download (requires enrollment:read)
      description: >
        The server fetches the installers from the release that matches its version and serves them, without sign-in,
        at /download/librepatch-agent.msi and /download/librepatch-agent.exe (rate limited per address).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, version, items]
                properties:
                  enabled: { type: boolean }
                  version: { type: string }
                  reason: { type: string, description: Why the downloads are not available (when enabled is false) }
                  error: { type: string, description: The last problem fetching the files }
                  checked_at: { type: string, format: date-time, nullable: true }
                  items:
                    type: array
                    items:
                      type: object
                      required: [kind, file_name, size, sha256, verified, url, available]
                      properties:
                        kind: { type: string, enum: [msi, exe] }
                        file_name: { type: string }
                        size: { type: integer, format: int64 }
                        sha256: { type: string }
                        verified: { type: boolean, description: The SHA-256 matched the one published beside the file }
                        url: { type: string }
                        available: { type: boolean }
  /enrollment-tokens:
    get:
      tags: [enrollment]
      summary: List enrollment tokens (requires enrollment:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/EnrollmentToken" } }
    post:
      tags: [enrollment]
      summary: Create an enrollment token; the secret is returned once (requires enrollment:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, max_uses, expires_in_hours, require_approval]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                max_uses: { type: integer, minimum: 1, maximum: 100000 }
                expires_in_hours: { type: integer, minimum: 1, maximum: 8760 }
                require_approval: { type: boolean }
                site_id: { type: string, format: uuid, nullable: true, description: The site new devices join (default - the first site) }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [token, enrollment_string, install_command, install, root_ca_pin]
                properties:
                  token: { $ref: "#/components/schemas/EnrollmentToken" }
                  enrollment_string: { type: string }
                  install_command: { type: string, description: The exe install command (kept for older callers; see install.exe.command) }
                  install:
                    type: object
                    description: Ready-made commands for an elevated prompt. A download line is empty while that installer is not on the server.
                    required: [msi, exe]
                    properties:
                      msi: { $ref: "#/components/schemas/InstallCommands" }
                      exe: { $ref: "#/components/schemas/InstallCommands" }
                  root_ca_pin: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /enrollment-tokens/{id}/revoke:
    post:
      tags: [enrollment]
      summary: Revoke an enrollment token (requires enrollment:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /enrollment-tokens/{id}:
    delete:
      tags: [enrollment]
      summary: Delete an enrollment token that can no longer be used, because it is revoked, expired or used up (requires enrollment:write; audited)
      description: >
        A token that can still enroll devices is refused with 409 and must be revoked first. Devices that enrolled with the token are kept.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      tags: [audit]
      summary: Audit log, newest first (requires audit:read)
      parameters:
        - { name: before_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditActorType" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditTarget" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
  /audit/verify:
    post:
      tags: [audit]
      summary: Walk the whole hash chain and report whether it is intact (requires audit:read; audited)
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [intact, checked, broken_at, seconds]
                properties:
                  intact: { type: boolean }
                  checked: { type: integer, format: int64 }
                  broken_at: { type: integer, format: int64, description: First bad entry id, 0 when intact }
                  seconds: { type: number }
        "409": { $ref: "#/components/responses/Error" }
  /audit.csv:
    get:
      tags: [audit]
      summary: The filtered audit log as CSV, at most 100000 rows (requires audit:read; audited)
      parameters:
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditOutcome" }
        - { $ref: "#/components/parameters/AuditActorType" }
        - { $ref: "#/components/parameters/AuditActor" }
        - { $ref: "#/components/parameters/AuditTarget" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /devices/{id}/software:
    get:
      tags: [inventory]
      summary: Software installed on a device (requires devices:read)
      description: System components (hidden in Add/Remove Programs) are omitted unless `include_system=true`.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, revision, truncated]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceSoftware" } }
                  total: { type: integer }
                  revision: { type: integer, description: Software inventory revision applied by the server }
                  updated_at: { type: string, format: date-time, nullable: true }
                  truncated: { type: boolean, description: The agent hit its item cap; the list is incomplete }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/software/history:
    get:
      tags: [inventory]
      summary: Software installs, removals and version changes on a device, newest first (requires devices:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: before, in: query, description: Return entries with an id below this one, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwareChange" } }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/users:
    get:
      tags: [inventory]
      summary: User profiles on a device (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceUser" } }
        "404": { $ref: "#/components/responses/Error" }
  /software:
    get:
      tags: [inventory]
      summary: Fleet-wide software, one row per product (requires devices:read)
      description: Products are grouped by normalized title, so "7-Zip 23.01 (x64)" and "7-Zip 24.08" are one product.
      parameters:
        - { name: q, in: query, description: Case-insensitive substring of product or publisher, schema: { type: string, maxLength: 200 } }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwareTitle" } }
                  total: { type: integer }
  /software/updates:
    get:
      tags: [deployments]
      summary: Catalog packages that are out of date on at least one active device, with those devices (requires deployments:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FleetUpdate" } }
  /software/{id}:
    get:
      tags: [inventory]
      summary: One product with its versions across the fleet, newest first (requires devices:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, name, publisher, versions]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  publisher: { type: string }
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, device_count]
                      properties:
                        version: { type: string }
                        device_count: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /software/{id}/installs:
    get:
      tags: [inventory]
      summary: Devices that have a product (requires devices:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: version, in: query, description: Exact version string, schema: { type: string, maxLength: 128 } }
        - { name: older_than, in: query, description: Only installs with a version strictly lower than this, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TitleInstall" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /groups:
    get:
      tags: [groups]
      summary: Dynamic groups (requires groups:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      tags: [groups]
      summary: Create a dynamic group (requires groups:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /groups/preview:
    post:
      tags: [groups]
      summary: Evaluate an unsaved filter and list the matching devices (requires groups:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filter]
              properties:
                filter: { $ref: "#/components/schemas/Filter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembers" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /groups/{id}:
    get:
      tags: [groups]
      summary: One group (requires groups:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [groups]
      summary: Replace a group's name, description and filter (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [groups]
      summary: Delete a group (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /groups/{id}/devices:
    get:
      tags: [groups]
      summary: Current members of a dynamic group (requires groups:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembers" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /reports/software.csv:
    get:
      tags: [reports]
      summary: CSV of every install on active devices (requires inventory:export; audited)
      description: Cells that would be read as spreadsheet formulas (leading `=`, `+`, `-`, `@`, tab, CR) are prefixed with `'`.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: title_id, in: query, schema: { type: string, format: uuid } }
        - { name: include_system, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/devices.csv:
    get:
      tags: [reports]
      summary: CSV of active devices, optionally one group's members (requires inventory:export; audited)
      parameters:
        - { name: group_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /devices/{id}/jobs:
    get:
      tags: [deployments]
      summary: Recent jobs of a device (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceJob" } }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/updates:
    get:
      tags: [deployments]
      summary: Installed programs for which the catalog or the winget index holds a newer version, and why the others have none (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, checks]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AvailableUpdate" } }
                  checks: { type: array, items: { $ref: "#/components/schemas/UpdateCheck" }, description: "One entry per other installed program: what the update check concluded" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/software/uninstall:
    post:
      tags: [deployments]
      summary: Queue an uninstall job for each listed inventory row (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [source, scope, item_key]
                    properties:
                      source: { type: string, enum: [reg64, reg32, hku, hku32, msi, appx, portable] }
                      scope: { type: string, enum: [machine, user] }
                      user_sid: { type: string }
                      item_key: { type: string }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_ids, skipped]
                properties:
                  job_ids: { type: array, items: { type: string, format: uuid } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [device, reason]
                      properties:
                        device: { type: string, description: The program that was skipped }
                        reason: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/refresh:
    post:
      tags: [devices]
      summary: Ask an online device to send its hardware, software and user information now (requires devices:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /updates:
    get:
      tags: [updates]
      summary: Windows updates reported by devices, with approval state and counts (requires updates:read)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: classification, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: ["", Critical, Important, Moderate, Low] } }
        - { name: decision, in: query, schema: { type: string, enum: [pending, approved, declined, hidden] } }
        - { name: missing, in: query, description: Only updates some device is missing, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WindowsUpdate" } }
                  total: { type: integer }
  /updates/decision:
    post:
      tags: [updates]
      summary: Approve, decline or hide updates, or reset them to pending (requires updates:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids, decision]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                decision: { type: string, enum: [approved, declined, hidden, none] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [changed, missing, hide_jobs]
                properties:
                  changed: { type: integer }
                  missing: { type: integer }
                  hide_jobs: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
  /updates/{id}/devices:
    get:
      tags: [updates]
      summary: Devices that report this update, with install attempts (requires updates:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device_id, hostname, state]
                      properties:
                        device_id: { type: string, format: uuid }
                        hostname: { type: string }
                        online: { type: boolean }
                        state: { type: string, enum: [missing, downloaded, hidden, pending_reboot, failed] }
                        last_error: { type: string }
                        scanned_at: { type: string, format: date-time }
                        revision: { type: integer }
                        attempt_state: { type: string, enum: ["", queued, installed, failed] }
                        attempt_failures: { type: integer }
                        attempt_finished_at: { type: string, format: date-time, nullable: true }
                        ring: { type: string }
  /updates/{id}/install:
    post:
      tags: [updates]
      summary: Install one update now on the listed devices, or on every device that misses it (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                device_ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
                restart: { $ref: "#/components/schemas/RestartPolicy" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-settings:
    get:
      tags: [updates]
      summary: Which update service devices use and whether drivers are included (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateSettings" }
    put:
      tags: [updates]
      summary: Change the update service settings; every device is sent them (requires updates:policy, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSettings" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /update-rules:
    get:
      tags: [updates]
      summary: Auto-approval rules (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UpdateRule" } }
    post:
      tags: [updates]
      summary: Create an auto-approval rule (requires updates:policy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRule" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRule" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-rules/{id}:
    put:
      tags: [updates]
      summary: Replace a rule (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRule" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRule" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [updates]
      summary: Delete a rule; approvals it already made stay (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /update-rings:
    get:
      tags: [updates]
      summary: Rollout rings in order (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UpdateRing" } }
    post:
      tags: [updates]
      summary: Create a ring (requires updates:policy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRing" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRing" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /update-rings/{id}:
    put:
      tags: [updates]
      summary: Replace a ring (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRing" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateRing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [updates]
      summary: Delete a ring (requires updates:policy)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /update-holds:
    get:
      tags: [updates]
      summary: Updates stopped from reaching later rings because a ring failed its success threshold (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, update_id, ring_name, reason, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        update_id: { type: string, format: uuid }
                        title: { type: string }
                        ring_name: { type: string }
                        reason: { type: string }
                        created_at: { type: string, format: date-time }
  /update-holds/{id}/release:
    post:
      tags: [updates]
      summary: Let the update continue to later rings despite the failures (requires updates:policy; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/Error" }
  /agent-releases:
    get:
      tags: [releases]
      summary: Stored agent releases, the rollout setting and its progress (requires releases:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, rollout, status]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentRelease" } }
                  rollout: { $ref: "#/components/schemas/AgentRollout" }
                  status: { $ref: "#/components/schemas/AgentRolloutStatus" }
    post:
      tags: [releases]
      summary: Upload a vendor-signed agent release (requires releases:write; audited)
      description: >
        The agent binary is the raw request body (application/octet-stream). The vendor bundle (.lprel, produced by
        librepatch-release) travels base64-encoded in X-Release-Bundle. The server verifies the signature against the
        vendor release keys compiled into it and checks the binary against the signed manifest; agents verify again.
      parameters:
        - { name: X-Release-Bundle, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRelease" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agent-releases/{id}/status:
    post:
      tags: [releases]
      summary: Withdraw a release (never offered again; pauses the rollout if it was the target) or make it available again (requires releases:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [available, withdrawn] }
      responses:
        "204": { description: Changed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /agent-releases/{id}:
    delete:
      tags: [releases]
      summary: Delete a release that is not the rollout target (requires releases:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /agent-rollout:
    get:
      tags: [releases]
      summary: Which release devices should run and how they get there (requires releases:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRollout" }
    put:
      tags: [releases]
      summary: Choose the target release, the pilot and the pacing; release_id null stops updating (requires releases:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRolloutInput" }
      responses:
        "204": { description: Saved }
        "422": { $ref: "#/components/responses/Error" }
  /auth/change-password:
    post:
      tags: [identity]
      summary: Change your password (also the forced change after an administrator set a temporary one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Changed during sign-in; carries the next MFA step like /auth/login
          content:
            application/json:
              schema:
                type: object
                required: [mfa, csrf_token]
                properties:
                  mfa: { type: string, enum: [verify, enroll] }
                  csrf_token: { type: string }
                  methods: { type: array, items: { type: string } }
                  totp_secret: { type: string }
                  otpauth_uri: { type: string }
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/webauthn/begin:
    post:
      tags: [identity]
      summary: Start signing in with a security key (password already verified)
      responses:
        "200":
          description: WebAuthn assertion options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnCeremony" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/webauthn/finish:
    post:
      tags: [identity]
      summary: Finish signing in with a security key (the browser's assertion is the body; ceremony in the query)
      parameters:
        - { name: ceremony, in: query, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/SessionStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/notice:
    get:
      tags: [auth]
      summary: The notice shown on the sign-in page, if the organization set one (public)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  text: { type: string }
                  require_ack: { type: boolean }
  /settings/schema:
    get:
      tags: [settings]
      summary: The settings sections the caller may open, with each field's label, help text, default, type and limits
      description: >
        Settings are declared once on the server; this is that declaration. Each section needs its own permission
        (settings:appearance, settings:security, settings:notifications, settings:updates, settings:devices,
        settings:reports, settings:data, settings:integrations); administrators hold all, operators the notifications,
        devices and reports sections. API tokens cannot hold these permissions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsSchema" }
  /settings/effective:
    get:
      tags: [settings]
      summary: The organization's display and formatting choices and the device and update defaults, for any signed-in person (no secrets, no security settings)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/sections/{section}:
    parameters:
      - { name: section, in: path, required: true, schema: { type: string } }
    get:
      tags: [settings]
      summary: One section's saved values (defaults where nothing was saved), its revision and which secrets are set
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsDoc" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      summary: Save a section (validated on the server, audited with before and after)
      description: >
        Send the revision you edited (0 if never saved) and the values. Keys you leave out keep their saved values. A
        secret is written by sending text, kept by leaving it out, and cleared with an empty string; secrets are never
        returned or exported. A different revision answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, values]
              properties:
                revision: { type: integer, format: int64 }
                values: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsDoc" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /settings/export:
    get:
      tags: [settings]
      summary: Every section's values as a JSON file (administrators; secrets are never included)
      responses:
        "200":
          description: The settings file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsFile" }
  /settings/import:
    post:
      tags: [settings]
      summary: Apply a settings file made by export (administrators); dry_run=1 only checks it
      parameters:
        - { name: dry_run, in: query, required: false, schema: { type: string, enum: ["0", "1", "true", "false"] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsFile" }
      responses:
        "200":
          description: Applied (or checked)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/fields:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [devices]
      summary: The values of the organization's custom device fields for one device
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  values: { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [devices]
      summary: Set or clear custom field values (a null or empty value clears; keys must be fields defined under Settings > Device defaults)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values: { type: object, additionalProperties: { type: string, nullable: true } }
      responses:
        "200":
          description: The values after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  values: { type: object, additionalProperties: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /settings/about:
    get:
      tags: [settings]
      summary: Version, build, database and counts (administrators)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/support-bundle:
    get:
      tags: [settings]
      summary: A zip for support with configuration and settings but no secrets (administrators; audited)
      description: >
        Contains version and build information, counts, the server configuration with every secret
        replaced, the settings export, the last audit entries without their details and the last notification
        deliveries without their content. Never contains keys, passwords, tokens, certificates or device data.
      responses:
        "200":
          description: The bundle
          content:
            application/zip:
              schema: { type: string, format: binary }
  /settings/data/status:
    get:
      tags: [settings]
      summary: History sizes and when the last backup, export and clean-up ran (from the audit log)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/data/run-retention:
    post:
      tags: [settings]
      summary: Apply the retention and clean-up settings now; returns what was removed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/reports/schedules/{id}/send-now:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [settings]
      summary: Send one saved report schedule now (to its recipients, as PDF or CSV) and record the run
      responses:
        "200": { description: Sent }
        "422": { $ref: "#/components/responses/Error" }
  /settings/reports/runs:
    get:
      tags: [settings]
      summary: The history of scheduled reports (sent, failed, skipped)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/notifications/test-email:
    post:
      tags: [settings]
      summary: Send a test message with the saved mail settings and report the mail server's own error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string }
      responses:
        "200": { description: Sent }
        "422": { $ref: "#/components/responses/Error" }
  /settings/notifications/log:
    get:
      tags: [settings]
      summary: Recent notification deliveries and failures
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /settings/integrations/webhooks/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [settings]
      summary: Send a test event to one saved webhook
      responses:
        "200": { description: Delivered }
        "422": { $ref: "#/components/responses/Error" }
  /settings/events:
    get:
      tags: [settings]
      summary: The webhook event reference, with an example payload for each event
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /dashboard:
    get:
      tags: [reports]
      summary: The dashboard's numbers in one request (each section only when the caller may see it; site-limited callers get their sites)
      parameters:
        - { name: site, in: query, required: false, schema: { type: string, format: uuid }, description: Only this site (the console's site switcher) }
      description: >
        Sections the caller may not see are null (or empty lists). Device, update and job numbers follow the caller's
        site scope; held updates and the audit activity need organization-wide rights. The compliance
        history is one point per day from an hourly snapshot (last 30 days).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      tags: [reports]
      summary: Things that need attention now (failed jobs in the last 24 hours and held updates), limited to what the caller may see
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Error" }
  /notifications/dismiss:
    post:
      tags: [reports]
      summary: Put items of the caller's own notification bell away (only changes what this person sees; not audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: { type: array, maxItems: 100, items: { type: string, maxLength: 100 }, description: The ids of the items (as returned by GET /notifications) }
                all: { type: boolean, description: Dismiss everything the bell shows the caller now }
      responses:
        "204": { description: Dismissed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /me/preferences:
    get:
      tags: [identity]
      summary: The signed-in person's console preferences (theme, table density, saved table views); they follow the account to any device
      responses:
        "200":
          description: OK (empty values until the person chooses)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
    put:
      tags: [identity]
      summary: Replace the signed-in person's console preferences (session only; an API token cannot)
      description: >
        The theme must be one the organization offers (Settings > Branding) when it restricts the list. Saved views are
        small opaque JSON objects (at most 4 KiB each, 20 per table).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/security:
    get:
      tags: [identity]
      summary: Your second factors and API tokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySecurity" }
  /me/api-tokens:
    post:
      tags: [identity]
      summary: Create an API token (session only; the secret is shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes, expires_in_days]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, items: { type: string }, minItems: 1, maxItems: 64 }
                expires_in_days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id, token, expires_at, scopes]
                properties:
                  id: { type: string, format: uuid }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  scopes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/api-tokens/{id}:
    delete:
      tags: [identity]
      summary: Revoke one of your API tokens
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /me/security-keys/begin:
    post:
      tags: [identity]
      summary: Start registering a security key
      responses:
        "200":
          description: WebAuthn creation options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnCeremony" }
        "503": { $ref: "#/components/responses/Error" }
  /me/security-keys/finish:
    post:
      tags: [identity]
      summary: Finish registering a security key (the browser's credential is the body)
      parameters:
        - { name: ceremony, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityKey" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/security-keys/{id}:
    delete:
      tags: [identity]
      summary: Remove one of your security keys (not the last second factor)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /branding:
    get:
      tags: [branding]
      summary: What the signed-out pages show - names, colors, login texts, support contact and image links
      description: >
        Public on purpose (the login page needs it) and cacheable by ETag. Before first-run setup it is the stock
        branding. Contains only display values; nothing that identifies users or devices.
      security: []
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBranding" }
        "304": { description: Not modified }
  /branding/assets/{kind}:
    get:
      tags: [branding]
      summary: One branding image (always image/png, re-encoded by the server)
      description: >
        Served with X-Content-Type-Options nosniff, Content-Security-Policy "default-src 'none'; sandbox" and
        Cross-Origin-Resource-Policy same-origin. A ?v=<version> query makes the response immutable-cacheable.
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/BrandingAssetKind" } }
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema: { type: string, format: binary }
        "304": { description: Not modified }
        "404": { description: No image in that slot }
  /settings/branding:
    get:
      tags: [branding]
      summary: Branding settings, resolved values, images and the live contrast checks (requires branding:write, administrators only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingView" }
    put:
      tags: [branding]
      summary: Replace the branding texts and colors (requires branding:write; audited as branding.update with before and after)
      description: >
        Empty strings mean the default (product name, accent) or nothing (everything else). A color combination that
        fails WCAG AA contrast is refused with 422 invalid_branding and a message per field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandingSettings" }
      responses:
        "200":
          description: Saved; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingView" }
        "422": { $ref: "#/components/responses/Error" }
  /settings/branding/assets/{kind}:
    put:
      tags: [branding]
      summary: Upload an image as the raw request body (requires branding:write; audited as branding.asset_set)
      description: >
        Only image/png and image/jpeg, at most 512 KiB, with per-slot dimension limits. SVG is refused (415). The
        file is decoded and re-encoded as a clean PNG: metadata, comments and trailing bytes are dropped.
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/BrandingAssetKind" } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Stored; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingView" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [branding]
      summary: Remove an image (requires branding:write; audited as branding.asset_delete)
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/BrandingAssetKind" } }
      responses:
        "200":
          description: Removed; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingView" }
        "404": { $ref: "#/components/responses/Error" }
  /settings/branding/reset:
    post:
      tags: [branding]
      summary: Reset branding to the defaults - texts, colors and images (requires branding:write; audited as branding.reset)
      responses:
        "200":
          description: Reset; the new view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandingView" }
  /sites:
    get:
      tags: [identity]
      summary: Sites (requires sites:read, organization-wide or for some sites)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Site" } }
    post:
      tags: [identity]
      summary: Create a site (requires sites:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /sites/{id}:
    put:
      tags: [identity]
      summary: Rename a site or change its time zone (requires sites:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteInput" }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [identity]
      summary: Delete an empty site (requires sites:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users:
    get:
      tags: [identity]
      summary: Users and their role bindings (requires users:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      tags: [identity]
      summary: Create a user with a temporary password they must change at first sign-in (requires users:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, display_name, roles]
              properties:
                email: { type: string, maxLength: 254 }
                display_name: { type: string, maxLength: 200 }
                password: { type: string, description: Optional; generated and returned once when empty }
                roles: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/RoleBinding" } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
                  temporary_password: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}:
    put:
      tags: [identity]
      summary: Change display name or enable/disable (requires users:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, status]
              properties:
                display_name: { type: string }
                status: { type: string, enum: [active, disabled] }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [identity]
      summary: Delete a user (requires users:write; never yourself or the last administrator)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/roles:
    post:
      tags: [identity]
      summary: Add a role binding (requires users:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleBinding" }
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/roles/{bid}:
    delete:
      tags: [identity]
      summary: Remove a role binding (requires users:write)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: bid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/reset-password:
    post:
      tags: [identity]
      summary: Set a temporary password and end the user's sessions (requires users:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: { type: string }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporary_password: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /users/{id}/reset-mfa:
    post:
      tags: [identity]
      summary: Remove all second factors; the user enrolls a new one at the next sign-in (requires users:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Reset }
  /api-tokens:
    get:
      tags: [identity]
      summary: Every API token of the organization (requires users:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
  /api-tokens/{id}:
    delete:
      tags: [identity]
      summary: Revoke any API token (requires users:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /policies:
    get:
      tags: [policies]
      summary: Software policies (requires policies:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwarePolicy" } }
    post:
      tags: [policies]
      summary: Create a software policy (requires policies:write; audited). An all-apps policy that adds apps from winget also needs catalog:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwarePolicyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /policies/preview:
    post:
      tags: [policies]
      summary: The apps an all-apps policy with these groups and this filter would handle, and the ones it would skip and why (requires policies:read; changes nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group_ids]
              properties:
                id: { type: string, format: uuid, description: The all-apps policy being edited; leave out for a new one }
                group_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
                filter: { $ref: "#/components/schemas/SoftwareAutoFilter" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwarePolicyPreview" }
        "422": { $ref: "#/components/responses/Error" }
  /policies/{id}/apps:
    get:
      tags: [policies]
      summary: The apps an all-apps policy handles, with where each one stands (requires policies:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SoftwarePolicyApp" } }
        "404": { $ref: "#/components/responses/Error" }
  /policies/{id}:
    put:
      tags: [policies]
      summary: Replace a software policy (requires policies:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SoftwarePolicyInput" }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [policies]
      summary: Delete a software policy; deployments it already made keep running (requires policies:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /software/approvals:
    get:
      tags: [policies]
      summary: Software versions waiting for approval, recent decisions and open ring holds (requires deployments:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SoftwareApprovals" }
    post:
      tags: [policies]
      summary: Approve or decline one version of a package, or put it back to waiting (requires deployments:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [package_id, version, decision]
              properties:
                package_id: { type: string, format: uuid }
                version: { type: string }
                decision: { type: string, enum: [approved, declined, reset] }
                note: { type: string, maxLength: 1000 }
      responses:
        "204": { description: Recorded }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /software/holds/{id}/release:
    post:
      tags: [policies]
      summary: Release a ring hold so the version moves on to the next ring (requires policies:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /reports/overview:
    get:
      tags: [reports]
      summary: Fleet health at a glance - device counts, patch compliance, jobs of the last 30 days (requires reports:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportOverview" }
  /reports/compliance:
    get:
      tags: [reports]
      summary: Patch compliance per device (requires reports:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ComplianceRow" } }
  /reports/compliance.csv:
    get:
      tags: [reports]
      summary: Patch compliance per device as CSV (requires inventory:export; audited)
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /vulnerabilities:
    get:
      tags: [vulnerabilities]
      summary: Known vulnerabilities (CVEs) that affect devices, the exploited ones first, with a summary and the state of the data (requires reports:read)
      parameters:
        - { name: exploited, in: query, required: false, schema: { type: boolean }, description: Only vulnerabilities on the CISA list of known exploited vulnerabilities }
        - { name: severity, in: query, required: false, schema: { type: string }, description: "Comma-separated: low, medium, high, critical" }
        - { name: q, in: query, required: false, schema: { type: string }, description: Text in the CVE id, summary or software name }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
        - { name: no_versions, in: query, required: false, schema: { type: boolean }, description: "Also include vulnerabilities for which the NVD names no versions (left out by default: they list fully patched devices; exploited ones are always listed)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilityOverview" }
  /vulnerabilities.csv:
    get:
      tags: [vulnerabilities]
      summary: The same list as CSV (requires inventory:export; audited)
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /vulnerabilities/{cve}/devices:
    get:
      tags: [vulnerabilities]
      summary: The devices a CVE affects, and what to update (requires reports:read)
      parameters:
        - { name: cve, in: path, required: true, schema: { type: string } }
        - { name: no_versions, in: query, required: false, schema: { type: boolean }, description: "Also include vulnerabilities for which the NVD names no versions (left out by default: they list fully patched devices; exploited ones are always listed)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VulnerabilityDevice" } }
        "400": { $ref: "#/components/responses/Error" }
  /vulnerabilities/sync:
    post:
      tags: [vulnerabilities]
      summary: Download the vulnerability feeds now (requires settings:integrations; audited as vulns.sync). The lookup must be turned on.
      responses:
        "200":
          description: What the run did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilitySyncReport" }
        "409": { $ref: "#/components/responses/Error" }
  /vulnerabilities/import:
    post:
      tags: [vulnerabilities]
      summary: Load a feed file by hand, for feeds the server cannot download (requires settings:integrations; audited as vulns.import)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, data]
              properties:
                kind: { type: string, enum: [kev, nvd] }
                data: { type: string, description: The text of the CISA catalog, or of one page of an NVD CVE API 2.0 answer }
      responses:
        "200":
          description: Loaded
          content:
            application/json:
              schema:
                type: object
                required: [kind, items]
                properties:
                  kind: { type: string }
                  items: { type: integer }
        "422": { $ref: "#/components/responses/Error" }
  /vulnerabilities/products:
    get:
      tags: [vulnerabilities]
      summary: Which installed programs are looked up in the vulnerability data, and as what (requires reports:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VulnerabilityProduct" } }
    post:
      tags: [vulnerabilities]
      summary: Add a program to look up, by the vendor and product names the NVD uses (requires settings:integrations; audited as vulns.product_add)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, vendor, product]
              properties:
                name: { type: string, description: The program's name as the software inventory shows it }
                vendor: { type: string }
                product: { type: string }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VulnerabilityProduct" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /vulnerabilities/products/{id}:
    put:
      tags: [vulnerabilities]
      summary: Switch a line on or off (requires settings:integrations; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [vulnerabilities]
      summary: Remove a line you added; lines that come with the product can only be switched off (requires settings:integrations; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/vulnerabilities:
    get:
      tags: [vulnerabilities]
      summary: The known vulnerabilities that affect one device (requires devices:read for the device)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: no_versions, in: query, required: false, schema: { type: boolean }, description: "Also include vulnerabilities for which the NVD names no versions (left out by default: they list fully patched devices; exploited ones are always listed)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, enabled, has_data]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeviceVulnerability" } }
                  enabled: { type: boolean }
                  has_data: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
  /reports/lifecycle:
    get:
      tags: [reports]
      summary: Which devices run an operating system that is out of support or soon will be (requires reports:read)
      description: The end-of-support dates are a built-in table (data_as_of says when it was reviewed), not a lookup on the internet.
      parameters:
        - { name: warn_days, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 3650, default: 180 }, description: How many days before the end of support a device counts as ending soon }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifecycleReport" }
  /reports/lifecycle.csv:
    get:
      tags: [reports]
      summary: The operating system lifecycle report as CSV (requires inventory:export; audited)
      parameters:
        - { name: warn_days, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 3650, default: 180 } }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
  /reports/compliance.html:
    get:
      tags: [reports]
      summary: Patch compliance per device as a printable page with the deployment's report logo, organization name and footer (requires inventory:export; audited)
      responses:
        "200":
          description: A standalone HTML page (no scripts; strict CSP)
          content:
            text/html:
              schema: { type: string }
  /update-conflicts:
    get:
      tags: [updates]
      summary: Devices whose update policy is managed by something else (WSUS, deferral policies, disabled automatic updates) (requires updates:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device_id, hostname]
                      properties:
                        device_id: { type: string, format: uuid }
                        hostname: { type: string }
                        policy: { $ref: "#/components/schemas/WuPolicy" }
  /devices/{id}/windows-updates:
    get:
      tags: [updates]
      summary: What this device's last Windows Update scan found, plus who manages updates on it (requires updates:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceWindowsUpdates" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/scan:
    post:
      tags: [updates]
      summary: Scan the device for updates now (requires updates:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/install:
    post:
      tags: [updates]
      summary: Install the chosen updates on this device now, ignoring rings and approval (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                restart: { $ref: "#/components/schemas/RestartPolicy" }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/scan-online:
    post:
      tags: [updates]
      summary: Check Windows Update on the internet once, even when Group Policy sends this device to WSUS (requires updates:policy; audited)
      description: >
        Read-only and one-off. The device reports the result like any scan (its `service` is the internet Windows Update) and does not
        remember this source for its daily scan. No policy on the device is changed. Drivers are never included.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/install-online:
    post:
      tags: [updates]
      summary: Install updates found by an online check, downloading them from Windows Update on the internet instead of WSUS (requires updates:policy; audited)
      description: >
        Like install, but the device uses the internet Windows Update for this one job, whatever its Group Policy says about WSUS or
        Configuration Manager. Only updates the device's last scan lists as missing are sent, so run an online check first.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                restart: { $ref: "#/components/schemas/RestartPolicy" }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/windows-updates/hide:
    post:
      tags: [updates]
      summary: Hide or unhide updates on this device (requires updates:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [update_ids, hide]
              properties:
                update_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 200 }
                hide: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/reboot:
    post:
      tags: [updates]
      summary: Restart an online device after a countdown that signed-in users can see (requires updates:write; audited)
      description: While an earlier restart request for the same device has not finished, the answer is that request's job (the second click is audited but queues nothing), so clicking twice restarts the computer once.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 1440 }
                reason: { type: string, maxLength: 200 }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/wake:
    post:
      tags: [devices]
      summary: Wake a sleeping device with a Wake-on-LAN packet sent by another online device on the same network (requires devices:wake; audited)
      description: |
        The server picks an online device whose network contains the sleeping device's last address (it needs the current agent, which reports its networks) and queues a job for it; that device sends the packet to its own network's broadcast address, nothing else. The job belongs to the helper. Whether the computer wakes depends on its firmware and network card settings.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202":
          description: A wake-up job was queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, helper]
                properties:
                  job_id: { type: string, format: uuid }
                  helper: { type: string, description: Host name of the device that sends the packet }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /devices/{id}/inspect:
    post:
      tags: [devices]
      summary: Ask an online device for a read-only view of itself (requires devices:inspect; audited)
      description: Running programs, services or recent event log entries (System, Application or Setup; never Security). The answer is read with GET /devices/{id}/views/{job} and is kept for an hour.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [processes, services, events] }
                log: { type: string, enum: ["", System, Application, Setup] }
                max_level: { type: integer, minimum: 0, maximum: 5, description: "Events: 1 critical to 5 verbose; 0 = 3" }
                since_minutes: { type: integer, minimum: 0, maximum: 10080, description: "Events: look back this far; 0 = 1440" }
                max_events: { type: integer, minimum: 0, maximum: 200, description: "Events: 0 = 100" }
      responses:
        "202": { $ref: "#/components/responses/JobQueued" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /devices/{id}/views/{job}:
    get:
      tags: [devices]
      summary: The state and, when ready, the data of a read-only view (requires devices:inspect)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceView" }
        "404": { $ref: "#/components/responses/Error" }
  /scripts:
    get:
      tags: [scripts]
      summary: The script library (requires scripts:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ScriptItem" } }
    post:
      tags: [scripts]
      summary: Add a script to the library (requires scripts:write; audited)
      description: Administrators only, and never through an API token. A script is PowerShell text of 1 to 65536 bytes. Every save of different content is a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /scripts/status:
    get:
      tags: [scripts]
      summary: Whether running scripts is switched on, whether runs need a second person's approval, and whether anyone else could approve (requires scripts:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, require_approval, other_approvers, max_devices]
                properties:
                  enabled: { type: boolean, description: "Settings > Scripts > Allow running scripts (on by default); off refuses every run and approval" }
                  require_approval: { type: boolean }
                  other_approvers: { type: integer, format: int64, description: Other active administrators who could approve a run you ask for }
                  max_devices: { type: integer }
  /scripts/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [scripts]
      summary: A script with its content and versions (requires scripts:read)
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1 }, description: Default is the current version }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptDetail" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [scripts]
      summary: Change a script; different content becomes a new version (requires scripts:write; audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [scripts]
      summary: Delete a script and its versions; earlier runs keep their own copy (requires scripts:write; audited)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /scripts/runs:
    get:
      tags: [scripts]
      summary: The newest script runs (requires scripts:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ScriptRun" } }
    post:
      tags: [scripts]
      summary: Ask for a script to be run on devices (requires scripts:run; audited)
      description: |
        The content of the chosen version is copied into the run. When the organization requires approval the run waits (24 hours) for another administrator; otherwise one signed job per device is queued at once. A device only runs it if its agent was installed with scripts switched on; the others end the job as rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptRunRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptRun" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /scripts/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [scripts]
      summary: A run with its exact content and one row per device (requires scripts:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptRunDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /scripts/runs/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [scripts]
      summary: Approve a run someone else asked for; its jobs are queued (requires scripts:approve; audited)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptDecision" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptRun" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /scripts/runs/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [scripts]
      summary: Reject a run that waits for approval (requires scripts:approve; audited)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScriptDecision" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptRun" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /scripts/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      tags: [scripts]
      summary: Withdraw a run and cancel the jobs that have not started (requires scripts:run; audited)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptRun" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /scripts/runs/{id}/jobs/{job}/output:
    get:
      tags: [scripts]
      summary: What the script printed on one device (requires scripts:read; kept 30 days, never shown on job pages)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScriptOutput" }
        "404": { $ref: "#/components/responses/Error" }
  /catalog/packages:
    get:
      tags: [catalog]
      summary: Imported packages (requires catalog:read)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Package" } }
  /catalog/index:
    get:
      tags: [catalog]
      summary: State of the winget index the server matches installed programs against (requires catalog:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WingetIndexStatus" }
  /catalog/index/refresh:
    post:
      tags: [catalog]
      summary: Download the winget index now (requires catalog:write; audited as catalog.index_refresh)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WingetIndexStatus" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/search:
    get:
      tags: [catalog]
      summary: Search imported packages, known suggestions and (for an exact winget identifier) the upstream versions (requires catalog:read)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [imported, suggestions]
                properties:
                  imported: { type: array, items: { $ref: "#/components/schemas/Package" } }
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [identifier, self_updating]
                      properties:
                        identifier: { type: string }
                        self_updating: { type: boolean }
                        note: { type: string }
                  index:
                    description: Packages of the winget index that match the words typed (present when the index has been downloaded)
                    type: array
                    items:
                      type: object
                      required: [identifier, name, latest_version, in_catalog]
                      properties:
                        identifier: { type: string }
                        name: { type: string }
                        latest_version: { type: string }
                        in_catalog: { type: boolean }
                  probe:
                    type: object
                    required: [identifier]
                    properties:
                      identifier: { type: string }
                      versions: { type: array, items: { type: string } }
                      error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /catalog/packages/{id}:
    get:
      tags: [catalog]
      summary: One package with versions, installers and overrides (requires catalog:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [catalog]
      summary: Remove a package that no deployment uses (requires catalog:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /catalog/packages/{id}/overrides:
    put:
      tags: [catalog]
      summary: Replace this organization's overrides of a package (requires catalog:override, admin only)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageOverride" }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/packages/{id}/verification:
    put:
      tags: [catalog]
      summary: Mark a winget package verified after testing it yourself, or remove the mark (requires catalog:override, admin only; audited as catalog.verify / catalog.unverify)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verified]
              properties:
                verified: { type: boolean }
      responses:
        "204": { description: Saved }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/overlays:
    get:
      tags: [catalog]
      summary: Signed catalog overlay sources, highest priority first (requires catalog:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, builtin_entries]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OverlaySource" } }
                  builtin_entries: { type: integer }
    post:
      tags: [catalog]
      summary: Add an overlay from an uploaded signed file or from a URL, under its author's public key (requires catalog:override; audited as catalog.overlay_add)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                label: { type: string, maxLength: 100, description: Defaults to the name inside the document }
                public_key: { type: string, description: 64 hexadecimal characters }
                url: { type: string, description: Fetch the signed file from here (http or https) }
                bundle: { type: string, description: The text of the signed .lpov file, when it is uploaded }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlaySource" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/overlays/{id}:
    put:
      tags: [catalog]
      summary: Rename an overlay source, switch it on or off, change its priority or address (requires catalog:override; audited as catalog.overlay_update)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, enabled, priority]
              properties:
                label: { type: string, maxLength: 100 }
                enabled: { type: boolean }
                priority: { type: integer, minimum: 1, maximum: 1000 }
                url: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlaySource" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [catalog]
      summary: Remove an overlay source (requires catalog:override; audited as catalog.overlay_delete)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /catalog/overlays/{id}/upload:
    post:
      tags: [catalog]
      summary: Load a newer signed file into a source; an older document than the source has is refused (requires catalog:override; audited as catalog.overlay_replace)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bundle]
              properties:
                bundle: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlayChange" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/overlays/{id}/refresh:
    post:
      tags: [catalog]
      summary: Ask a URL source for a newer document now (requires catalog:override; audited as catalog.overlay_refresh)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverlayChange" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /catalog/overlay-template:
    get:
      tags: [catalog]
      summary: An unsigned overlay document built from this organization's own overrides and verified marks, to edit and sign (requires catalog:override)
      responses:
        "200":
          description: JSON document
          content:
            application/json:
              schema: { type: object }
  /catalog/import:
    post:
      tags: [catalog]
      summary: Import a winget package version from the winget-pkgs repository (requires catalog:write)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identifier]
              properties:
                identifier: { type: string, description: "winget PackageIdentifier, e.g. 7zip.7zip" }
                version: { type: string, description: "Empty = newest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /catalog/content:
    post:
      tags: [catalog]
      summary: Upload an installer (raw body, at most 2 GiB); stored by SHA-256 (requires catalog:write)
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [sha256, size, file_name]
                properties:
                  sha256: { type: string }
                  size: { type: integer }
                  file_name: { type: string }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /catalog/custom:
    post:
      tags: [catalog]
      summary: Register an uploaded installer as a custom package version (requires catalog:write)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomPackage" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "422": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      tags: [catalog]
      summary: Organization settings (requires catalog:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSettings" }
    put:
      tags: [catalog]
      summary: Change organization settings (requires settings:write, admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSettings" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
  /deployments:
    get:
      tags: [deployments]
      summary: Deployments, newest first (requires deployments:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeploymentSummary" } }
    post:
      tags: [deployments]
      summary: Plan a deployment and queue its jobs (requires deployments:write)
      description: |
        Unverified packages need `unverified_confirmed: true` (audited). Jobs are signed when dispatched and
        carry `starts_at` as not_before, so devices can run them without contacting the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeploymentRequest" }
      responses:
        "201":
          description: Planned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPlan" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /deployments/{id}:
    get:
      tags: [deployments]
      summary: One deployment with job counts per status (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /deployments/{id}/jobs:
    get:
      tags: [deployments]
      summary: Per-device jobs of a deployment (requires deployments:read)
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeploymentJob" } }
        "404": { $ref: "#/components/responses/Error" }
  /deployments/{id}/cancel:
    post:
      tags: [deployments]
      summary: Cancel everything not yet finished (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{id}:
    get:
      tags: [deployments]
      summary: One job with its event log and result (requires deployments:read)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /jobs/{id}/cancel:
    post:
      tags: [deployments]
      summary: Stop one job that has not finished, including one that is running on the device (requires deployments:write; audited)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /jobs/{id}/retry:
    post:
      tags: [deployments]
      summary: Queue a new attempt of a failed, expired, rejected or cancelled job (requires deployments:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /groups/{id}/members:
    post:
      tags: [groups]
      summary: Add or remove devices of a static group (requires groups:write)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                add: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
                remove: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }
      responses:
        "204": { description: Updated }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /events:
    get:
      tags: [devices]
      summary: Server-Sent Events stream of device changes (requires devices:read)
      description: Events carry only `{type, device_id}`; clients re-fetch through the API.
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-lp_session
    apiToken:
      type: http
      scheme: bearer
      description: An API token (lp_...) created under Account security. Its power is its scopes intersected with its owner's current permissions.
  parameters:
    AuditAction: { name: action, in: query, description: Action name prefix such as user. or deployment.create, schema: { type: string, maxLength: 100 } }
    AuditOutcome: { name: outcome, in: query, schema: { type: string, enum: [success, denied, error] } }
    AuditActorType: { name: actor_type, in: query, schema: { type: string, enum: [user, system, device, anonymous] } }
    AuditActor: { name: actor, in: query, description: Actor id or IP address, schema: { type: string, maxLength: 100 } }
    AuditTarget: { name: target, in: query, description: A target id, schema: { type: string, maxLength: 100 } }
    AuditFrom: { name: from, in: query, schema: { type: string, format: date-time } }
    AuditTo: { name: to, in: query, schema: { type: string, format: date-time } }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code]
            properties:
              code: { type: string, maxLength: 32, description: 6-digit TOTP or recovery code }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JobQueued:
      description: A job was queued for the device
      content:
        application/json:
          schema:
            type: object
            required: [job_id]
            properties:
              job_id: { type: string, format: uuid }
    SessionStarted:
      description: Signed in
      content:
        application/json:
          schema:
            type: object
            required: [csrf_token]
            properties:
              csrf_token: { type: string }
              recovery_codes: { type: array, items: { type: string } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string }, description: "Per-field messages (invalid_branding)" }
    Preferences:
      type: object
      additionalProperties: false
      properties:
        theme: { type: string, description: "A theme id (lower-case letters, digits, dashes); empty = the organization's default" }
        density: { type: string, enum: ["", comfortable, compact] }
        views:
          type: object
          description: Saved table views by table id
          additionalProperties:
            type: array
            maxItems: 20
            items:
              type: object
              required: [id, name, state]
              properties:
                id: { type: string }
                name: { type: string, maxLength: 60 }
                state: { type: object, additionalProperties: true }
        nav:
          type: object
          description: Sidebar layout. Left out of a save, the stored value is kept.
          additionalProperties: false
          properties:
            collapsed: { type: boolean, description: Narrowed to icons }
            closed:
              type: array
              maxItems: 32
              items: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
        dashboard:
          type: object
          description: Dashboard widget order and hidden widgets. Left out of a save, the stored value is kept.
          additionalProperties: false
          properties:
            order:
              type: array
              maxItems: 32
              items: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
            hidden:
              type: array
              maxItems: 32
              items: { type: string, pattern: "^[a-z][a-z0-9-]{0,39}$" }
    SettingsSchema:
      type: object
      properties:
        schema_version: { type: integer }
        events: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
        sections:
          type: array
          items: { $ref: "#/components/schemas/SettingsSection" }
    SettingsSection:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        perm: { type: string }
        editable: { type: boolean }
        fields: { type: array, items: { $ref: "#/components/schemas/SettingsField" } }
    SettingsField:
      type: object
      description: One setting. kind is bool, int, string, text, enum, multi, time, timezone, emails, cidrs, url, secret, list, regex or tags.
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        kind: { type: string }
        default: {}
        min: { type: integer }
        max: { type: integer }
        unit: { type: string }
        placeholder: { type: string }
        required: { type: boolean }
        fixed: { type: boolean }
        item_key: { type: string }
        show_if: { type: string }
        effect: { type: string, enum: [live, prefill, planned], description: "live: acted on now; prefill: used as a starting value; planned: stored only" }
        options: { type: array, items: { type: object, properties: { value: { type: string }, label: { type: string } } } }
        fields: { type: array, items: { $ref: "#/components/schemas/SettingsField" } }
    SettingsDoc:
      type: object
      properties:
        section: { type: string }
        revision: { type: integer, format: int64 }
        values: { type: object, additionalProperties: true }
        secrets_set: { type: object, additionalProperties: { type: boolean } }
        updated_at: { type: string, format: date-time }
    SettingsFile:
      type: object
      required: [format, schema_version, sections]
      properties:
        format: { type: string, enum: [librepatch-settings] }
        schema_version: { type: integer }
        exported_at: { type: string, format: date-time }
        sections: { type: object, additionalProperties: { type: object, additionalProperties: true } }
    Notification:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [failed_job, held_update] }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        detail: { type: string }
        to: { type: string, description: A console path }
        at: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        generated: { type: string, format: date-time }
        devices:
          nullable: true
          type: object
          properties:
            total: { type: integer }
            online: { type: integer }
            offline: { type: integer }
            pending: { type: integer }
        needs_restart: { type: integer, nullable: true }
        missing_critical_devices: { type: integer, nullable: true }
        failed_jobs_24h: { type: integer, nullable: true }
        held_updates: { type: integer, nullable: true }
        setup:
          nullable: true
          description: What has been set up so far, for the getting-started checklist (needs deployments:read for the whole organization)
          type: object
          required: [policies, deployments]
          properties:
            policies: { type: integer, format: int64, description: Software policies made (one-app policies and all-apps policies) }
            deployments: { type: integer, format: int64 }
        software:
          nullable: true
          description: The apps that are out of date (organization-wide, like the Software updates page; needs deployments:read for the whole organization)
          type: object
          required: [apps, devices, vendor, automated, top, all_apps_policy]
          properties:
            apps: { type: integer, description: Apps with a newer version that LibrePatch can install }
            devices: { type: integer, description: Devices that have at least one such app out of date }
            vendor: { type: integer, description: Apps with an update that are left to their own updater }
            automated: { type: integer, description: Of the apps, how many an enabled policy keeps updated }
            all_apps_policy: { type: boolean, description: An all-apps policy is switched on }
            top:
              type: array
              items:
                type: object
                required: [name, latest_version, devices, automated]
                properties:
                  package_id: { type: string, format: uuid, nullable: true }
                  name: { type: string }
                  latest_version: { type: string }
                  devices: { type: integer }
                  automated: { type: boolean }
        compliance:
          nullable: true
          type: object
          properties:
            compliant: { type: integer }
            non_compliant: { type: integer }
            unknown: { type: integer }
            history:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  compliant: { type: integer }
                  non_compliant: { type: integer }
                  unknown: { type: integer }
        top_missing:
          type: array
          items:
            type: object
            properties:
              update_id: { type: string, format: uuid }
              title: { type: string }
              severity: { type: string }
              classification: { type: string }
              kb: { type: array, items: { type: string } }
              devices: { type: integer }
        attention:
          type: array
          items:
            type: object
            properties:
              device_id: { type: string, format: uuid }
              hostname: { type: string }
              reasons: { type: array, items: { type: string, enum: [offline, reboot_pending, critical_missing, failed_updates] } }
        activity:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        agent_versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              devices: { type: integer }
    BrandingAssetKind:
      type: string
      enum: [logo_light, logo_dark, icon, favicon, report_logo]
    BrandingSettings:
      type: object
      additionalProperties: false
      properties:
        org_name: { type: string, maxLength: 120 }
        product_name: { type: string, maxLength: 60, description: "Empty = LibrePatch" }
        accent_color: { type: string, description: "#rrggbb; empty = default. Must reach 4.5:1 against white and 3:1 against the dark theme surface." }
        secondary_color: { type: string, description: "#rrggbb or empty; must reach 3:1 against both themes" }
        login_headline: { type: string, maxLength: 120 }
        login_message: { type: string, maxLength: 1000 }
        login_footer: { type: string, maxLength: 1000 }
        support_email: { type: string, maxLength: 254 }
        support_phone: { type: string, maxLength: 40 }
        support_url: { type: string, maxLength: 300, description: "https only" }
        report_footer: { type: string, maxLength: 500 }
        default_theme: { type: string, description: "Theme for people who have not chosen one; empty = follow the device" }
        allowed_themes: { type: array, maxItems: 16, items: { type: string }, description: "Themes people may pick; empty = all" }
    BrandingAssetRef:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
    PublicBranding:
      type: object
      required: [product_name, org_name, title, accent_color, secondary_color, login_headline, login_message, login_footer, support, default_theme, allowed_themes, assets, version]
      properties:
        product_name: { type: string }
        org_name: { type: string }
        title: { type: string }
        accent_color: { type: string }
        secondary_color: { type: string }
        login_headline: { type: string }
        login_message: { type: string }
        login_footer: { type: string }
        default_theme: { type: string }
        allowed_themes: { type: array, items: { type: string } }
        support:
          type: object
          properties:
            email: { type: string }
            phone: { type: string }
            url: { type: string }
        assets: { type: object, additionalProperties: { $ref: "#/components/schemas/BrandingAssetRef" } }
        version: { type: string }
    BrandingContrastCheck:
      type: object
      required: [id, label, foreground, background, ratio, required, pass]
      properties:
        id: { type: string }
        label: { type: string }
        foreground: { type: string }
        background: { type: string }
        ratio: { type: number }
        required: { type: number }
        pass: { type: boolean }
    BrandingAssetInfo:
      allOf:
        - { $ref: "#/components/schemas/BrandingAssetRef" }
        - type: object
          required: [kind, size, sha256, updated_at]
          properties:
            kind: { type: string }
            size: { type: integer, format: int64 }
            sha256: { type: string }
            updated_at: { type: string, format: date-time }
    BrandingView:
      type: object
      required: [settings, resolved, assets, defaults, contrast]
      properties:
        settings: { $ref: "#/components/schemas/BrandingSettings" }
        resolved: { $ref: "#/components/schemas/PublicBranding" }
        assets: { type: object, additionalProperties: { $ref: "#/components/schemas/BrandingAssetInfo" } }
        defaults:
          type: object
          required: [product_name, accent_color]
          properties:
            product_name: { type: string }
            accent_color: { type: string }
        contrast: { type: array, items: { $ref: "#/components/schemas/BrandingContrastCheck" } }
        updated_at: { type: string, format: date-time, nullable: true }
    TOTPEnrollment:
      type: object
      required: [totp_secret, otpauth_uri]
      properties:
        totp_secret: { type: string }
        otpauth_uri: { type: string }
    SessionInfo:
      type: object
      required: [user, org, permissions, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            display_name: { type: string }
        org:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        permissions: { type: array, items: { type: string }, description: Organization-wide permissions }
        scoped_permissions: { type: array, items: { type: string }, description: Permissions held only for some sites }
        site_permissions: { type: object, additionalProperties: { type: array, items: { type: string } }, description: Per-site permissions by site id }
        csrf_token: { type: string }
        master_key_pending: { type: boolean, description: "True until the administrator has saved the master key the stack generated for itself (D109); until then every call except this one, signing out and the key screen is refused with master_key_unconfirmed" }
    AvailableUpdate:
      type: object
      required: [name, installed_version, source, scope, item_key, package_id, package_name, latest_version, deployable]
      properties:
        name: { type: string }
        installed_version: { type: string }
        source: { type: string }
        scope: { type: string, enum: [machine, user] }
        user_sid: { type: string }
        item_key: { type: string }
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        identifier: { type: string }
        latest_version: { type: string }
        verified: { type: boolean }
        self_updating: { type: boolean }
        deployable: { type: boolean }
        reason: { type: string }
        in_catalog: { type: boolean, description: "false when the update comes from the winget index only (package_id is then the nil UUID and winget_id names the package)" }
        winget_id: { type: string }
        matched_by: { type: string, enum: [product_code, name] }
    UpdateCheck:
      type: object
      required: [source, scope, item_key, status, message]
      properties:
        source: { type: string }
        scope: { type: string, enum: [machine, user] }
        user_sid: { type: string }
        item_key: { type: string }
        status: { type: string, enum: [current, unrecognised, skipped], description: "current: recognised and nothing newer; unrecognised: could not be tied to a package; skipped: not checked on purpose (store apps, portable programs, exclusions)" }
        message: { type: string, description: A plain-words explanation }
    WingetIndexStatus:
      type: object
      required: [enabled, url, package_count]
      properties:
        enabled: { type: boolean }
        url: { type: string }
        package_count: { type: integer }
        fetched_at: { type: string, format: date-time, nullable: true }
        source_updated_at: { type: string, format: date-time, nullable: true }
        checked_at: { type: string, format: date-time, nullable: true }
        error: { type: string }
    FleetUpdate:
      type: object
      required: [package_id, package_name, latest_version, deployable, in_catalog, devices]
      properties:
        package_id: { type: string, format: uuid, description: "the nil UUID when the package is only known from the winget index" }
        package_name: { type: string }
        identifier: { type: string }
        winget_id: { type: string }
        in_catalog: { type: boolean }
        latest_version: { type: string }
        verified: { type: boolean }
        self_updating: { type: boolean }
        deployable: { type: boolean }
        reason: { type: string }
        devices:
          type: array
          items:
            type: object
            required: [device_id, hostname, installed_version, scope]
            properties:
              device_id: { type: string, format: uuid }
              hostname: { type: string }
              installed_version: { type: string }
              scope: { type: string, enum: [machine, user] }
              matched_by: { type: string, enum: [product_code, name] }
    WindowsUpdate:
      type: object
      required: [update_id, title, classification, decision, devices_missing]
      properties:
        update_id: { type: string, format: uuid }
        revision: { type: integer }
        title: { type: string }
        kb: { type: array, items: { type: string } }
        classification: { type: string }
        severity: { type: string }
        products: { type: array, items: { type: string } }
        is_driver: { type: boolean }
        release_date: { type: string, format: date-time, nullable: true }
        reboot_required: { type: boolean }
        support_url: { type: string }
        first_seen_at: { type: string, format: date-time }
        decision: { type: string, enum: ["", approved, declined, hidden], description: Empty = pending review }
        decision_source: { type: string, enum: ["", manual, rule] }
        decided_at: { type: string, format: date-time, nullable: true }
        note: { type: string }
        devices_missing: { type: integer }
        devices_pending_reboot: { type: integer }
        devices_installed: { type: integer }
        devices_failed: { type: integer }
        holds: { type: integer }
    RestartPolicy:
      type: object
      additionalProperties: false
      properties:
        allow: { type: string, enum: [never, outside_active_hours, deadline] }
        active_start: { type: integer, minimum: 0, maximum: 1439, description: Device-local minutes after midnight }
        active_end: { type: integer, minimum: 0, maximum: 1439 }
        notify_minutes: { type: integer, minimum: 0, maximum: 1440, description: Countdown shown to signed-in users (default 15) }
        deadline_hours: { type: integer, minimum: 0, maximum: 720, description: For deadline - restart at the latest this long after the install }
    AgentRelease:
      type: object
      required: [id, version, os, arch, sha256, size, status, created_at, devices_on, is_target]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        key_id: { type: string }
        notes: { type: string }
        authenticode_subject: { type: string }
        min_version: { type: string }
        status: { type: string, enum: [available, withdrawn] }
        created_at: { type: string, format: date-time }
        devices_on: { type: integer, format: int64, description: Active devices currently running this version }
        is_target: { type: boolean }
    AgentRollout:
      type: object
      required: [release_id, pilot_group_ids, soak_hours, success_threshold, batch_per_tick, paused, auto_new_release]
      properties:
        release_id: { type: string, format: uuid, nullable: true }
        auto_new_release: { type: boolean, description: A newer release that came with the server image becomes the target by itself }
        pilot_group_ids: { type: array, items: { type: string, format: uuid } }
        soak_hours: { type: integer }
        success_threshold: { type: integer }
        batch_per_tick: { type: integer }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        paused: { type: boolean }
        paused_reason: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    AgentRolloutInput:
      type: object
      additionalProperties: false
      required: [soak_hours, success_threshold, batch_per_tick]
      properties:
        release_id: { type: string, format: uuid, nullable: true }
        pilot_group_ids: { type: array, items: { type: string, format: uuid }, maxItems: 50 }
        soak_hours: { type: integer, minimum: 0, maximum: 720 }
        success_threshold: { type: integer, minimum: 1, maximum: 100 }
        batch_per_tick: { type: integer, minimum: 1, maximum: 1000 }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        paused: { type: boolean }
        auto_new_release: { type: boolean, description: Make a newer release that came with the server image the target by itself }
    AgentRolloutStatus:
      type: object
      required: [versions, updated, failed, queued, pilot_devices, pilot_updated, pilot_failed, waiting]
      properties:
        versions:
          type: array
          items:
            type: object
            required: [version, devices, online]
            properties:
              version: { type: string }
              devices: { type: integer, format: int64 }
              online: { type: integer, format: int64 }
        updated: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        queued: { type: integer, format: int64 }
        pilot_devices: { type: integer }
        pilot_updated: { type: integer, format: int64 }
        pilot_failed: { type: integer, format: int64 }
        waiting: { type: string, description: Why devices outside the pilot are not being updated yet }
    WebAuthnCeremony:
      type: object
      required: [ceremony, options]
      properties:
        ceremony: { type: string, format: uuid }
        options: { type: object, description: The WebAuthn options object for navigator.credentials }
    SecurityKey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    ApiToken:
      type: object
      required: [id, name, prefix, scopes, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip: { type: string }
        revoked_at: { type: string, format: date-time, nullable: true }
        owner: { type: string, description: Owner email (organization-wide list only) }
    MySecurity:
      type: object
      required: [totp, security_keys, api_tokens, webauthn_available, token_scopes]
      properties:
        totp: { type: boolean }
        security_keys: { type: array, items: { $ref: "#/components/schemas/SecurityKey" } }
        api_tokens: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        webauthn_available: { type: boolean }
        token_scopes: { type: array, items: { type: string }, description: Scopes you may put in a token }
    Site:
      type: object
      required: [id, name, timezone, created_at, devices]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        devices: { type: integer, format: int64 }
    SiteInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string }
    RoleBinding:
      type: object
      additionalProperties: false
      required: [role, scope_type, scope_id]
      properties:
        role: { type: string, enum: [admin, operator, readonly] }
        scope_type: { type: string, enum: [org, site] }
        scope_id: { type: string, format: uuid, description: The organization id for org, a site id for site }
    User:
      type: object
      required: [id, email, display_name, status, created_at, must_change_password, has_totp, security_keys, bindings]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        locked_until: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        must_change_password: { type: boolean }
        has_totp: { type: boolean }
        security_keys: { type: integer }
        sso: { type: boolean, description: Signs in with the organization's identity provider }
        bindings:
          type: array
          items:
            type: object
            required: [id, role, scope_type, scope_id]
            properties:
              id: { type: string, format: uuid }
              role: { type: string }
              scope_type: { type: string }
              scope_id: { type: string, format: uuid }
              source: { type: string, enum: [local, sso], description: "sso = follows the identity provider at every sign-in; local = set by hand" }
    SoftwarePolicy:
      type: object
      required: [id, name, kind, package_id, package_name, group_ids, delay_days, only_new_devices, unverified_confirmed, enabled, created_at, devices_attempted, state, state_text, auto, apps]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [keep_updated, baseline, keep_all], description: "keep_all keeps every app with an update current (no package of its own)" }
        package_id: { type: string, format: uuid, nullable: true }
        package_name: { type: string }
        package_identifier: { type: string }
        group_ids: { type: array, items: { type: string, format: uuid } }
        delay_days: { type: integer }
        only_new_devices: { type: boolean }
        unverified_confirmed: { type: boolean }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        enabled: { type: boolean }
        use_rings: { type: boolean, description: Roll new versions out through the update rings (keep-updated policies only) }
        require_approval: { type: boolean, description: A new version waits for an administrator's approval before it goes out }
        prompts: { allOf: [{ $ref: "#/components/schemas/InstallPrompts" }], nullable: true }
        created_at: { type: string, format: date-time }
        devices_attempted: { type: integer, format: int64 }
        rollout: { allOf: [{ $ref: "#/components/schemas/SoftwareRollout" }], nullable: true, description: The state of the newest version; set only for a policy that uses rings or approval }
        state: { type: string, description: "What the last check found, as a code (up_to_date, updating, waiting_approval, waiting_delay, waiting_ring, held, retry, gave_up, declined, left_to_vendor, excluded, no_version, package_missing, error, new, off; for an all-apps policy no_apps, first_check_soon, apps_waiting, apps_updating, apps_all_current, apps_need_attention)" }
        state_text: { type: string, description: The same in a sentence }
        last_check_at: { type: string, format: date-time, nullable: true }
        next_check_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true, description: When the policy last created a deployment }
        last_deployment_id: { type: string, format: uuid, nullable: true }
        auto: { type: boolean, description: True for an all-apps policy }
        filter: { $ref: "#/components/schemas/SoftwareAutoFilter" }
        apps: { type: integer, format: int64, description: The apps an all-apps policy handles now }
        app_states: { type: object, additionalProperties: { type: integer, format: int64 }, description: The apps of an all-apps policy counted by state }
    SoftwareAutoFilter:
      type: object
      additionalProperties: false
      description: Which apps an all-apps policy handles
      properties:
        verified_only: { type: boolean, default: true, description: Handle only apps verified on test machines }
        include_unlisted: { type: boolean, description: Also add apps that are not in the catalog yet from the winget index (needs verified_only off and catalog:write) }
        include_self_updating: { type: boolean, default: true, description: Also keep apps current that normally update themselves (Chrome, Edge, Zoom) when they are still out of date on a device }
        exclude: { type: array, maxItems: 200, items: { type: string }, description: Package identifiers to leave alone }
    SoftwarePolicyApp:
      type: object
      required: [policy_id, package_id, name, identifier, verified, state, state_text, added_at]
      properties:
        policy_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        name: { type: string }
        identifier: { type: string }
        verified: { type: boolean }
        state: { type: string }
        state_text: { type: string }
        last_check_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_deployment_id: { type: string, format: uuid, nullable: true }
        added_at: { type: string, format: date-time }
    SoftwarePolicyPreview:
      type: object
      required: [items, handled, skipped, truncated]
      properties:
        handled: { type: integer }
        skipped: { type: integer }
        truncated: { type: boolean }
        items:
          type: array
          items:
            type: object
            required: [package_id, name, identifier, latest_version, devices, handled]
            properties:
              package_id: { type: string, format: uuid, nullable: true }
              name: { type: string }
              identifier: { type: string }
              latest_version: { type: string }
              devices: { type: integer, description: Devices in the groups that have an older version }
              handled: { type: boolean }
              reason: { type: string, enum: [vendor, excluded, unverified, unlisted, other_policy, catalog_excluded, limit] }
              reason_text: { type: string }
    SoftwareRollout:
      type: object
      required: [version, imported_at, approval, waiting, stages]
      properties:
        version: { type: string }
        imported_at: { type: string, format: date-time }
        approval: { type: string, enum: [not_required, pending, approved, declined] }
        approved_at: { type: string, format: date-time }
        blocked: { type: string, enum: [excluded, self_updating, no_version, delay, pending_approval, declined], description: Why nothing goes out right now }
        available_at: { type: string, format: date-time, description: The earliest moment the first ring may install }
        waiting: { type: integer, description: Devices that still need the version }
        stages:
          type: array
          items:
            type: object
            required: [name, ring, devices, waiting, installed, failed, state]
            properties:
              name: { type: string }
              ring: { type: boolean, description: False for the devices that are in no ring }
              devices: { type: integer }
              waiting: { type: integer }
              installed: { type: integer }
              failed: { type: integer }
              state: { type: string, enum: [waiting, running, passed, done, held] }
              hold_id: { type: string, format: uuid }
              reason: { type: string }
    SoftwareApprovalItem:
      type: object
      required: [package_id, package_name, version, decision, note, decided_by, policies, devices]
      properties:
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        version: { type: string }
        decision: { type: string, enum: [pending, approved, declined] }
        note: { type: string }
        imported_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string }
        policies: { type: array, items: { type: string } }
        devices: { type: integer }
    SoftwareHold:
      type: object
      required: [id, policy_id, policy, package_name, version, ring, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        policy_id: { type: string, format: uuid }
        policy: { type: string }
        package_name: { type: string }
        version: { type: string }
        ring: { type: string }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    SoftwareApprovals:
      type: object
      required: [pending, recent, holds]
      properties:
        pending: { type: array, items: { $ref: "#/components/schemas/SoftwareApprovalItem" } }
        recent: { type: array, items: { $ref: "#/components/schemas/SoftwareApprovalItem" } }
        holds: { type: array, items: { $ref: "#/components/schemas/SoftwareHold" } }
    SoftwarePolicyInput:
      type: object
      additionalProperties: false
      required: [name, kind, group_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [keep_updated, baseline, keep_all] }
        package_id: { type: string, format: uuid, description: Required except for keep_all }
        filter: { $ref: "#/components/schemas/SoftwareAutoFilter" }
        group_ids: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid } }
        delay_days: { type: integer, minimum: 0, maximum: 365 }
        only_new_devices: { type: boolean }
        unverified_confirmed: { type: boolean }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        use_rings: { type: boolean, description: Roll new versions out through the update rings (keep-updated policies only) }
        require_approval: { type: boolean, description: A new version waits for an administrator's approval }
        prompts: { allOf: [{ $ref: "#/components/schemas/InstallPrompts" }], nullable: true }
        enabled: { type: boolean }
    ComplianceRow:
      type: object
      required: [device_id, hostname, state, approved_missing, critical_missing, failed_updates, reboot_pending, online]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        site_id: { type: string, format: uuid }
        os: { type: string }
        os_build: { type: string }
        agent_version: { type: string }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_scan_at: { type: string, format: date-time, nullable: true }
        approved_missing: { type: integer }
        critical_missing: { type: integer }
        failed_updates: { type: integer }
        reboot_pending: { type: boolean }
        state: { type: string, enum: [compliant, non_compliant, unknown] }
    Vulnerability:
      type: object
      required: [id, summary, severity, exploited, exploited_name, ransomware, required_action, devices, products, fixed_in, no_versions]
      properties:
        id: { type: string, example: CVE-2026-0001 }
        published: { type: string, format: date-time, nullable: true }
        summary: { type: string }
        cvss: { type: number, nullable: true, description: CVSS base score, 0 to 10 }
        severity: { type: string, enum: ["", low, medium, high, critical] }
        exploited: { type: boolean, description: On the CISA list of known exploited vulnerabilities }
        exploited_name: { type: string }
        kev_added: { type: string, format: date-time, nullable: true }
        kev_due: { type: string, format: date-time, nullable: true, description: The date CISA asks for it to be fixed by }
        ransomware: { type: boolean, description: Known to be used in ransomware campaigns }
        required_action: { type: string }
        devices: { type: integer }
        products: { type: array, items: { type: string } }
        fixed_in: { type: array, items: { type: string }, description: What to update to, per product }
        no_versions: { type: boolean, description: The NVD names no versions for it, so a patched device is listed too (only shown when exploited or asked for) }
    VulnerabilitySummary:
      type: object
      required: [cves, exploited, critical, high, devices, devices_covered, devices_active, no_versions]
      properties:
        cves: { type: integer }
        exploited: { type: integer }
        critical: { type: integer }
        high: { type: integer }
        devices: { type: integer, description: Devices affected by at least one }
        devices_covered: { type: integer, description: Devices that have something the lookup knows about }
        devices_active: { type: integer }
        no_versions: { type: integer, description: Vulnerabilities left out of the list because the NVD names no versions for them (0 when they are included) }
    VulnerabilityFeed:
      type: object
      required: [feed, last_ok, last_attempt, status, last_error, items]
      properties:
        feed: { type: string, description: "kev, or nvd:<vendor>:<product>" }
        last_ok: { type: string, format: date-time, nullable: true }
        last_attempt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [new, ok, error] }
        last_error: { type: string }
        items: { type: integer }
    VulnerabilityStatus:
      type: object
      required: [enabled, counts, feeds, tracked_products, kev_updated_at, nvd_updated_at, problems]
      properties:
        enabled: { type: boolean }
        counts:
          type: object
          required: [cves, cves_with_versions, exploited]
          properties:
            cves: { type: integer }
            cves_with_versions: { type: integer }
            exploited: { type: integer }
        feeds: { type: array, items: { $ref: "#/components/schemas/VulnerabilityFeed" } }
        tracked_products: { type: integer, description: Programs and Windows releases of the fleet that are looked up }
        kev_updated_at: { type: string, format: date-time, nullable: true }
        nvd_updated_at: { type: string, format: date-time, nullable: true, description: The oldest successful refresh among the products the fleet has; null until every one has been downloaded }
        problems: { type: integer }
    VulnerabilityOverview:
      type: object
      required: [summary, items, status]
      properties:
        summary: { $ref: "#/components/schemas/VulnerabilitySummary" }
        items: { type: array, items: { $ref: "#/components/schemas/Vulnerability" } }
        status: { $ref: "#/components/schemas/VulnerabilityStatus" }
    VulnerabilityDevice:
      type: object
      required: [device_id, hostname, product, installed, fixed_in]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        product: { type: string }
        installed: { type: string }
        fixed_in: { type: string, description: The version that fixes it; empty when none is known }
        update:
          nullable: true
          description: The update of the same program on that device, when there is one (only for callers who may read deployments for the whole organization)
          type: object
          required: [package_name, in_catalog, latest_version, verified, self_updating, deployable, scope, fixes]
          properties:
            package_id: { type: string, format: uuid, nullable: true, description: Null while the program is not in the catalog yet }
            package_name: { type: string }
            winget_id: { type: string }
            in_catalog: { type: boolean }
            latest_version: { type: string }
            verified: { type: boolean }
            self_updating: { type: boolean }
            deployable: { type: boolean, description: False when the program is left to its own updater }
            scope: { type: string, enum: [machine, user] }
            fixes: { type: string, enum: ["yes", "no", "unknown"], description: "Whether the newest version is at or past the fixed version (unknown when the advisory names none)" }
    DeviceVulnerability:
      allOf:
        - { $ref: "#/components/schemas/Vulnerability" }
        - type: object
          required: [product, installed]
          properties:
            product: { type: string }
            installed: { type: string }
    VulnerabilityProduct:
      type: object
      required: [id, name, vendor, product, source, enabled, devices]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: The normalized program name the software inventory uses }
        vendor: { type: string }
        product: { type: string }
        source: { type: string, enum: [builtin, user] }
        enabled: { type: boolean }
        devices: { type: integer, description: Active devices that have the program }
    VulnerabilitySyncReport:
      type: object
      required: [kev, kev_items, products, pending, cves, requests, errors]
      properties:
        kev: { type: string, enum: [downloaded, unchanged, skipped, failed] }
        kev_items: { type: integer }
        products: { type: integer }
        pending: { type: integer, description: Products left for the next run }
        cves: { type: integer }
        requests: { type: integer }
        errors: { type: array, items: { type: string } }
    LifecycleRow:
      type: object
      required: [device_id, hostname, os, version, build, edition, product, release, end_of_support, days_left, status, note, last_seen_at]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        os: { type: string, description: The product name the device reports, example Windows 11 Pro }
        version: { type: string, description: The feature version the device reports, example 24H2 }
        build: { type: integer }
        edition: { type: string, description: The Windows edition id, example Professional }
        product: { type: string, description: The operating system the table matched, example Windows 11 }
        release: { type: string }
        end_of_support: { type: string, format: date, nullable: true }
        days_left: { type: integer, nullable: true, description: Negative once support has ended; null when the end date is not known }
        status: { type: string, enum: [supported, ending_soon, unsupported, unknown] }
        note: { type: string }
        last_seen_at: { type: string, format: date-time, nullable: true }
    LifecycleReport:
      type: object
      required: [data_as_of, warn_days, items, summary]
      properties:
        data_as_of: { type: string, format: date }
        warn_days: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/LifecycleRow" } }
        summary:
          type: object
          required: [supported, ending_soon, unsupported, unknown]
          properties:
            supported: { type: integer }
            ending_soon: { type: integer }
            unsupported: { type: integer }
            unknown: { type: integer }
    ReportOverview:
      type: object
      required: [devices, compliance, jobs_30d, generated]
      properties:
        devices:
          type: object
          properties:
            active: { type: integer, format: int64 }
            pending: { type: integer, format: int64 }
            revoked: { type: integer, format: int64 }
            online: { type: integer, format: int64 }
            not_seen_for_a_week: { type: integer, format: int64 }
            reboot_pending: { type: integer }
        compliance:
          type: object
          properties:
            compliant: { type: integer }
            non_compliant: { type: integer }
            unknown: { type: integer }
        jobs_30d:
          type: array
          items:
            type: object
            required: [type, status, count]
            properties:
              type: { type: string }
              status: { type: string }
              count: { type: integer, format: int64 }
        generated: { type: string, format: date-time }
    UpdateSettings:
      type: object
      additionalProperties: false
      required: [service]
      properties:
        service: { type: string, enum: [default, windows_update, microsoft_update] }
        include_drivers: { type: boolean }
    UpdateRule:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        classifications: { type: array, items: { type: string }, description: Empty = any }
        severities: { type: array, items: { type: string, enum: [Critical, Important, Moderate, Low, Unrated] }, description: Empty = any }
        include_drivers: { type: boolean }
        delay_days: { type: integer, minimum: 0, maximum: 365, description: Days after release }
        enabled: { type: boolean }
    UpdateRing:
      type: object
      additionalProperties: false
      required: [name, ordinal, success_threshold]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        ordinal: { type: integer, minimum: 1, maximum: 20 }
        group_ids: { type: array, items: { type: string, format: uuid } }
        delay_days: { type: integer, minimum: 0, maximum: 365, description: Days after approval before this ring may install }
        soak_hours: { type: integer, minimum: 0, maximum: 2160, description: How long the next ring waits after this ring started }
        success_threshold: { type: integer, minimum: 1, maximum: 100, description: Percent of reporting devices that must install successfully }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        restart: { $ref: "#/components/schemas/RestartPolicy" }
        enabled: { type: boolean }
    WuPolicy:
      type: object
      properties:
        wsus_configured: { type: boolean }
        wsus_server: { type: string }
        wufb_deferrals: { type: boolean }
        no_auto_update: { type: boolean }
        au_options: { type: integer }
        active_hours_policy: { type: boolean }
        wu_service_disabled: { type: boolean }
        effective_source: { type: string }
        notes: { type: array, items: { type: string } }
    DeviceWindowsUpdates:
      type: object
      required: [items, reboot_required]
      properties:
        scanned_at: { type: string, format: date-time, nullable: true }
        scan_error: { type: string }
        reboot_required: { type: boolean, description: The device's live restart-pending flag (from its heartbeat), not the one saved with the last scan }
        truncated: { type: boolean }
        service: { type: integer, description: "Update service the last scan used: 1 the device's own source (WSUS if policy sets one), 2 Windows Update on the internet, 3 Microsoft Update" }
        policy: { $ref: "#/components/schemas/WuPolicy" }
        items:
          type: array
          items:
            type: object
            required: [update_id, title, state]
            properties:
              update_id: { type: string, format: uuid }
              revision: { type: integer }
              state: { type: string, enum: [missing, downloaded, hidden, pending_reboot, failed] }
              last_error: { type: string }
              title: { type: string }
              kb: { type: array, items: { type: string } }
              classification: { type: string }
              severity: { type: string }
              is_driver: { type: boolean }
              release_date: { type: string, format: date-time, nullable: true }
              reboot_required: { type: boolean }
              support_url: { type: string }
              decision: { type: string }
              attempt_state: { type: string }
              attempt_failures: { type: integer }
    DeviceSoftware:
      type: object
      required: [title_id, name, version, source, scope, system_component, first_seen_at, last_seen_at]
      properties:
        title_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        publisher: { type: string }
        source: { type: string, enum: [reg64, reg32, hku, hku32, msi, appx, portable] }
        scope: { type: string, enum: [machine, user] }
        user_sid: { type: string, description: Empty for machine-scope installs }
        item_key: { type: string, description: Uninstall subkey name or MSI product code (identifies the row) }
        install_date: { type: string }
        install_location: { type: string }
        product_code: { type: string }
        system_component: { type: boolean }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    SoftwareChange:
      type: object
      required: [id, name, scope, change, observed_at]
      properties:
        id: { type: integer }
        name: { type: string }
        scope: { type: string }
        user_sid: { type: string }
        change: { type: string, enum: [added, removed, version] }
        old_version: { type: string }
        new_version: { type: string }
        observed_at: { type: string, format: date-time }
    DeviceUser:
      type: object
      required: [sid, username, domain, loaded, is_admin]
      properties:
        sid: { type: string }
        username: { type: string }
        domain: { type: string }
        profile_path: { type: string }
        last_logon_at: { type: string, format: date-time, nullable: true }
        loaded: { type: boolean }
        is_admin: { type: boolean }
    SoftwareTitle:
      type: object
      required: [id, name, publisher, device_count, version_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        publisher: { type: string }
        device_count: { type: integer }
        version_count: { type: integer }
    TitleInstall:
      type: object
      required: [device_id, hostname, online, version, scope, source]
      properties:
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        online: { type: boolean }
        version: { type: string }
        scope: { type: string }
        user_sid: { type: string }
        source: { type: string }
        install_date: { type: string }
        install_location: { type: string }
        last_seen_at: { type: string, format: date-time }
    Filter:
      type: object
      description: |
        Filter tree. `op` is one of `and`, `or`, `not` (use `children`), `device`
        (`field`, `cmp`, `value`) or `software` (`title`, optional `match`, `publisher`,
        `version`, `scope`). Allowed fields and limits are in docs/DATA_MODEL.md.
      required: [op]
      properties:
        op: { type: string, enum: [and, or, not, device, software] }
        children: { type: array, items: { $ref: "#/components/schemas/Filter" } }
        field: { type: string }
        cmp: { type: string }
        value: {}
        title: { type: string }
        match: { type: string, enum: [exact, prefix, contains] }
        publisher: { type: string }
        scope: { type: string, enum: [machine, user] }
        version:
          type: object
          required: [cmp, value]
          properties:
            cmp: { type: string, enum: [lt, le, gt, ge, eq, ne] }
            value: { type: string }
    Detection:
      type: object
      required: [kind, key]
      properties:
        kind: { type: string, enum: [msi, registry, file, appx] }
        key: { type: string, maxLength: 512 }
        value_name: { type: string }
        version: { type: string }
        cmp: { type: string, enum: ["", eq, ge] }
    Package:
      type: object
      required: [id, source, identifier, name, verified, self_updating]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [winget, custom] }
        identifier: { type: string }
        name: { type: string }
        publisher: { type: string }
        homepage: { type: string }
        license: { type: string }
        description: { type: string }
        verified: { type: boolean, description: Counts as verified - it passed the VM test matrix or an administrator marked it after testing it }
        verified_source: { type: string, enum: ["", tests, organization, overlay], description: Why the package counts as verified }
        verified_by: { type: string, description: The overlay that vouches for the package, when verified_source is overlay }
        self_updating: { type: boolean }
        imported_at: { type: string, format: date-time }
        version_count: { type: integer }
    Installer:
      type: object
      required: [id, architecture, scope, type, sha256, unsupported]
      properties:
        id: { type: string, format: uuid }
        architecture: { type: string, enum: [x64, x86, arm64, neutral] }
        scope: { type: string, enum: [machine, user, any] }
        type: { type: string, enum: [msi, msix, inno, nsis, burn, exe, portable, zip] }
        nested_type: { type: string }
        url: { type: string }
        sha256: { type: string }
        size: { type: integer }
        file_name: { type: string }
        product_code: { type: string }
        signer_subject: { type: string }
        silent_args: { type: array, items: { type: string } }
        custom_args: { type: array, items: { type: string } }
        detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
        unsupported: { type: string, description: Why this installer cannot be deployed (empty = deployable) }
        server_content: { type: boolean }
    PackageOverride:
      type: object
      additionalProperties: false
      properties:
        silent_args: { type: array, items: { type: string }, description: Replaces the manifest's switches; validated tokens only }
        extra_detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
        pin: { type: string, description: "'' | latest | '= <version>' | '< <version>'" }
        excluded: { type: boolean }
        user_scope_policy: { type: string, enum: ["", report_only, update_in_place, convert_to_machine, remove] }
        self_update_policy: { type: string, enum: ["", defer_to_vendor, enforce] }
        processes: { type: array, items: { type: string }, nullable: true, description: "Image names (for example chrome.exe) of the programs an update replaces. Omit to leave the stored list unchanged." }
    PackageDetail:
      type: object
      required: [package, versions, override, effective_user_scope_policy]
      properties:
        package: { $ref: "#/components/schemas/Package" }
        versions:
          type: array
          items:
            type: object
            required: [id, version, installers]
            properties:
              id: { type: string, format: uuid }
              version: { type: string }
              imported_at: { type: string, format: date-time }
              installers: { type: array, items: { $ref: "#/components/schemas/Installer" } }
        override: { $ref: "#/components/schemas/PackageOverride" }
        verification:
          description: Who marked the package verified, when and for which version (null when no administrator did)
          type: object
          nullable: true
          properties:
            by: { type: string }
            at: { type: string, format: date-time, nullable: true }
            version: { type: string }
        effective_user_scope_policy: { type: string }
        effective_user_scope_policy_source: { type: string }
        overlay:
          description: What a signed catalog overlay says about the package (null when none does)
          type: object
          nullable: true
          properties:
            source: { type: string }
            note: { type: string }
            self_updating: { type: boolean, nullable: true }
            verified: { type: boolean }
            verified_note: { type: string }
            silent_args: { type: array, items: { type: string } }
            detection_rules: { type: integer }
            processes: { type: array, items: { type: string } }
    OverlayChange:
      type: object
      required: [changed, version, entries]
      properties:
        changed: { type: boolean }
        version: { type: integer, format: int64 }
        entries: { type: integer }
    OverlaySource:
      type: object
      required: [id, label, kind, url, public_key, key_id, enabled, priority, doc_name, doc_version, doc_issued_at, entries, verified_entries, status, last_error]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        kind: { type: string, enum: [upload, url] }
        url: { type: string }
        public_key: { type: string, description: The hex Ed25519 public key the document must be signed with }
        key_id: { type: string }
        enabled: { type: boolean }
        priority: { type: integer, minimum: 1, maximum: 1000, description: A lower number wins when two overlays name the same package }
        doc_name: { type: string }
        doc_version: { type: integer, format: int64 }
        doc_issued_at: { type: string }
        entries: { type: integer }
        verified_entries: { type: integer }
        fetched_at: { type: string, format: date-time, nullable: true }
        checked_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [new, ok, error] }
        last_error: { type: string }
    ImportResult:
      type: object
      required: [package_id, version_id, identifier, version, installers, deployable]
      properties:
        package_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        identifier: { type: string }
        version: { type: string }
        installers: { type: integer }
        deployable: { type: integer }
        warnings: { type: array, items: { type: string } }
    CustomPackage:
      type: object
      additionalProperties: false
      required: [identifier, name, version, sha256, file_name, type, arch, scope]
      properties:
        identifier: { type: string }
        name: { type: string }
        publisher: { type: string }
        version: { type: string }
        description: { type: string }
        sha256: { type: string, description: Hash returned by the content upload }
        file_name: { type: string }
        type: { type: string, enum: [msi, inno, nsis, burn, exe, portable, zip] }
        nested_type: { type: string }
        nested_path: { type: string }
        arch: { type: string, enum: [x64, x86, arm64, neutral] }
        scope: { type: string, enum: [machine, user, any] }
        args: { type: array, items: { type: string } }
        product_code: { type: string }
        signer_subject: { type: string }
        success_codes: { type: array, items: { type: integer } }
        detection: { type: array, items: { $ref: "#/components/schemas/Detection" } }
    OrgSettings:
      type: object
      additionalProperties: false
      required: [user_scope_policy]
      properties:
        user_scope_policy: { type: string, enum: [report_only, update_in_place, convert_to_machine, remove] }
    MaintenanceWindow:
      type: object
      additionalProperties: false
      required: [start_minute, duration_minutes]
      properties:
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        duration_minutes: { type: integer, minimum: 1, maximum: 1440 }
        tz: { type: string, description: IANA name; empty = device-local time }
    ScriptInput:
      type: object
      additionalProperties: false
      required: [name, content]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 65536, description: PowerShell text }
        note: { type: string, maxLength: 200, description: What changed (kept with the version) }
    ScriptItem:
      type: object
      required: [id, name, description, interpreter, version, updated_at, runs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        interpreter: { type: string, enum: [powershell] }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        runs: { type: integer, format: int64 }
        last_run_at: { type: string, format: date-time, nullable: true }
    ScriptDetail:
      allOf:
        - $ref: "#/components/schemas/ScriptItem"
        - type: object
          required: [content, sha256, versions]
          properties:
            content: { type: string }
            sha256: { type: string, description: Fingerprint of the content shown }
            versions:
              type: array
              items:
                type: object
                required: [version, sha256, note, created_at, created_by]
                properties:
                  version: { type: integer }
                  sha256: { type: string }
                  note: { type: string }
                  created_at: { type: string, format: date-time }
                  created_by: { type: string }
    ScriptRunRequest:
      type: object
      additionalProperties: false
      required: [script_id, reason]
      properties:
        script_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: 0 = the current version }
        group_ids: { type: array, items: { type: string, format: uuid } }
        device_ids: { type: array, items: { type: string, format: uuid } }
        timeout_s: { type: integer, minimum: 0, maximum: 3600, description: "0 = 300; otherwise 10 to 3600. The script and everything it started are ended when it is over." }
        reason: { type: string, minLength: 1, maxLength: 200, description: Why; recorded with the run and in the audit log }
    ScriptDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 200 }
    ScriptRun:
      type: object
      required: [id, script_name, version, sha256, reason, status, devices, timeout_s, requested_at, requested_by, succeeded, failed, needs_approval]
      properties:
        id: { type: string, format: uuid }
        script_id: { type: string, format: uuid, nullable: true }
        script_name: { type: string }
        version: { type: integer }
        sha256: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending_approval, running, completed, completed_with_errors, failed, rejected, cancelled, expired], description: "running while any computer's job is still open; then completed, completed_with_errors or failed, worked out from the jobs" }
        devices: { type: integer }
        timeout_s: { type: integer }
        requested_at: { type: string, format: date-time }
        requested_by: { type: string }
        requested_by_id: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decided_by: { type: string }
        decision_note: { type: string }
        succeeded: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        needs_approval: { type: boolean }
    ScriptRunDetail:
      allOf:
        - $ref: "#/components/schemas/ScriptRun"
        - type: object
          required: [content, jobs]
          properties:
            content: { type: string, description: Exactly what is sent to the devices }
            jobs:
              type: array
              items:
                type: object
                required: [job_id, device_id, hostname, status, status_reason, has_output]
                properties:
                  job_id: { type: string, format: uuid }
                  device_id: { type: string, format: uuid }
                  hostname: { type: string }
                  status: { $ref: "#/components/schemas/JobStatus" }
                  status_reason: { type: string }
                  exit_code: { type: integer, nullable: true }
                  finished_at: { type: string, format: date-time, nullable: true }
                  has_output: { type: boolean }
    ScriptOutput:
      type: object
      required: [job_id, exit_code, output, created_at]
      properties:
        job_id: { type: string, format: uuid }
        exit_code: { type: integer }
        output: { type: string }
        created_at: { type: string, format: date-time }
    DeviceView:
      type: object
      required: [status, status_reason]
      properties:
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        kind: { type: string, enum: [processes, services, events] }
        data:
          type: object
          description: "{kind, taken_at, truncated, total, items[]}; the item fields depend on kind"
          properties:
            kind: { type: string }
            taken_at: { type: integer, format: int64 }
            truncated: { type: boolean }
            total: { type: integer }
            items: { type: array, items: { type: object, additionalProperties: true } }
    InstallPrompts:
      type: object
      additionalProperties: false
      description: |
        Optional messages to the signed-in user while software is installed. Omitted or all defaults = fully silent.
        The programs to wait for, ask about or close are the package's `processes` (package override or signed overlay).
      properties:
        in_use: { type: string, enum: [ignore, skip, ask, close], default: ignore, description: "What to do when the package's programs are open: ignore = install silently; skip = wait until they are closed; ask = ask the user to let them be closed; close = warn, then close" }
        ask_timeout_s: { type: integer, minimum: 0, maximum: 3600, description: "How long the question or warning stays up (0 = 300, otherwise 30 to 3600)" }
        defer_minutes: { type: integer, minimum: 0, maximum: 1440, description: "How long skip and ask wait before looking again (0 = 60, otherwise 5 to 1440)" }
        restart: { type: string, enum: [none, ask, countdown], default: none, description: "What happens when the installer says it needs a restart: none = only report it; ask = ask the user; countdown = restart after a countdown" }
        restart_notify_minutes: { type: integer, minimum: 0, maximum: 1440, description: "Length of the restart countdown (0 = 5)" }
    DeploymentRequest:
      type: object
      additionalProperties: false
      required: [name, action, package_id, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        action: { type: string, enum: [install, update, uninstall] }
        package_id: { type: string, format: uuid }
        version: { type: string, description: Empty = newest allowed by the package's pin }
        scope: { type: string, enum: [machine, user] }
        group_ids: { type: array, items: { type: string, format: uuid } }
        device_ids: { type: array, items: { type: string, format: uuid } }
        starts_at: { type: string, format: date-time }
        expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 72 }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        unverified_confirmed: { type: boolean }
        prompts: { allOf: [{ $ref: "#/components/schemas/InstallPrompts" }], nullable: true }
    DeploymentPlan:
      type: object
      required: [deployment_id, devices, jobs, user_jobs, skipped]
      properties:
        deployment_id: { type: string, format: uuid }
        devices: { type: integer }
        jobs: { type: integer }
        user_jobs: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [device, reason]
            properties:
              device: { type: string }
              reason: { type: string }
        per_user_found: { type: integer }
        per_user_policy: { type: string }
    DeploymentSummary:
      type: object
      required: [id, name, action, scope, status, package_name, jobs_total, jobs_succeeded, jobs_failed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string }
        scope: { type: string }
        status: { type: string, enum: [active, paused, completed, cancelled] }
        package_name: { type: string }
        package_identifier: { type: string }
        version: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        jobs_total: { type: integer }
        jobs_succeeded: { type: integer }
        jobs_failed: { type: integer }
    DeploymentDetail:
      type: object
      required: [id, name, action, scope, status, job_counts]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string }
        scope: { type: string }
        status: { type: string }
        package_id: { type: string, format: uuid }
        package_name: { type: string }
        package_identifier: { type: string }
        version: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        unverified_confirmed: { type: boolean }
        window: { $ref: "#/components/schemas/MaintenanceWindow" }
        prompts: { allOf: [{ $ref: "#/components/schemas/InstallPrompts" }], nullable: true }
        job_counts: { type: object, additionalProperties: { type: integer } }
    JobStatus:
      type: string
      enum: [queued, sent, accepted, waiting, running, succeeded, succeeded_reboot, failed, expired, cancelled, rejected]
    DeploymentJob:
      type: object
      required: [id, device_id, hostname, type, title, status]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        detection_passed: { type: boolean, nullable: true }
        reboot_required: { type: boolean }
        depends_on: { type: string, format: uuid, nullable: true }
    DeviceJob:
      type: object
      required: [id, type, title, status]
      properties:
        id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid, nullable: true }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        reboot_required: { type: boolean }
    JobDetail:
      type: object
      required: [id, device_id, type, title, status, events]
      properties:
        id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid, nullable: true }
        device_id: { type: string, format: uuid }
        hostname: { type: string }
        user_sid: { type: string }
        type: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        status_reason: { type: string }
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        acked_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_code: { type: integer, nullable: true }
        detection_passed: { type: boolean, nullable: true }
        reboot_required: { type: boolean }
        depends_on: { type: string, format: uuid, nullable: true }
        result:
          type: object
          nullable: true
          properties:
            outcome: { type: string }
            message: { type: string }
            log_tail: { type: string, description: Tail of the installer log, at most 16 KiB }
            installed_version: { type: string }
            already_satisfied: { type: boolean }
            exit_code: { type: integer }
        events:
          type: array
          items:
            type: object
            required: [id, time, kind]
            properties:
              id: { type: integer }
              time: { type: string, format: date-time }
              kind: { type: string }
              message: { type: string }
    GroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        kind: { type: string, enum: [dynamic, static], default: dynamic, description: Fixed at creation }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        filter: { $ref: "#/components/schemas/Filter", description: Required for dynamic groups; a static group has none }
    Group:
      type: object
      required: [id, kind, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dynamic, static] }
        name: { type: string }
        description: { type: string }
        filter: { $ref: "#/components/schemas/Filter" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupMembers:
      type: object
      required: [items, total]
      properties:
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, hostname, online]
            properties:
              id: { type: string, format: uuid }
              hostname: { type: string }
              chassis: { type: string }
              manufacturer: { type: string }
              model: { type: string }
              os_caption: { type: string }
              os_build: { type: string }
              online: { type: boolean }
              last_seen_at: { type: string, format: date-time, nullable: true }
              software_count: { type: integer }
    Device:
      type: object
      required: [id, site_id, status, hostname, online, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, active, revoked, retired] }
        status_reason: { type: string }
        hostname: { type: string }
        os_caption: { type: string }
        os_build: { type: string }
        arch: { type: string }
        agent_version: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serial: { type: string }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_ip: { type: string }
        enrolled_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        uptime_s: { type: integer }
        pending_reboot: { type: boolean }
        logged_on_user: { type: string }
        peer_port: { type: integer, description: "Port on which the device shares downloaded installers with others on its network (0 = not sharing)" }
        replaces_device_id: { type: string, format: uuid, nullable: true }
        chassis: { type: string }
        software_count: { type: integer }
        software_updated_at: { type: string, format: date-time, nullable: true }
        inventory_truncated: { type: boolean }
        hardware: { $ref: "#/components/schemas/Hardware" }
        certificates:
          type: array
          items:
            type: object
            required: [serial, not_before, not_after]
            properties:
              serial: { type: string }
              not_before: { type: string, format: date-time }
              not_after: { type: string, format: date-time }
              revoked_at: { type: string, format: date-time, nullable: true }
    Hardware:
      type: object
      description: Snapshot reported by the agent (protobuf field names).
      properties:
        hostname: { type: string }
        fqdn: { type: string }
        domain: { type: string }
        os_caption: { type: string }
        os_display_version: { type: string }
        os_edition: { type: string }
        os_build: { type: integer }
        os_ubr: { type: integer }
        os_version: { type: string }
        arch: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serial: { type: string }
        smbios_uuid: { type: string }
        chassis: { type: string }
        bios_version: { type: string }
        cpu_model: { type: string }
        cpu_logical_cores: { type: integer }
        ram_bytes: { type: string, description: uint64 encoded as a string (protobuf JSON) }
        disks:
          type: array
          items:
            type: object
            properties:
              mount: { type: string }
              filesystem: { type: string }
              size_bytes: { type: string }
              free_bytes: { type: string }
              bitlocker: { type: string, enum: [protected, unprotected, encrypting, decrypting, unknown, unsupported, ""] }
        interfaces:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              mac: { type: string }
              addresses: { type: array, items: { type: string } }
        last_logged_on_user: { type: string }
        pending_reboot: { type: boolean }
        pending_reboot_reasons: { type: array, items: { type: string } }
        queued_file_delete_count: { type: integer, description: "Files queued for deletion at the next restart (installer leftovers). Listed on the device page; counted as a pending restart only when the device defaults say so" }
        queued_file_deletes: { type: array, items: { type: string }, description: The first few of them }
        timezone: { type: string }
        boot_time: { type: string }
    InstallCommands:
      type: object
      required: [one_liner, download, command]
      properties:
        one_liner: { type: string, description: "ONE line for an elevated Command Prompt or PowerShell that downloads the installer from this server, installs it, waits for the install and deletes the file (empty when the installer is not on this server)" }
        download: { type: string, description: "curl.exe line that downloads the installer into the current folder (empty when it is not available)" }
        command: { type: string, description: The plain install command for a file in the current folder (contains the enrollment token) }
    EnrollmentToken:
      type: object
      required: [id, name, max_uses, used_count, expires_at, require_approval, created_at, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        max_uses: { type: integer }
        used_count: { type: integer }
        expires_at: { type: string, format: date-time }
        require_approval: { type: boolean }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [active, revoked, expired, exhausted] }
    AuditEntry:
      type: object
      required: [id, ts, actor_type, actor_id, action, outcome, target_ids, details]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        actor_type: { type: string }
        actor_id: { type: string }
        actor_name: { type: string, description: Email of a user actor }
        actor_ip: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_ids: { type: array, items: { type: string } }
        outcome: { type: string, enum: [success, denied, error] }
        details: { type: object, additionalProperties: true }
security:
  - session: []
